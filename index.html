<body class="bg-paper text-ink font-sans antialiased">
<div id="app"></div>
<script>
/* ---------- Constants & formatting ---------- */
const TODAY = '2026-09-30';
const PAYDAY = '2026-10-15';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CATEGORIES = ['Food', 'Transport', 'Load', 'Bills', 'Income', 'Others'];

const pad2 = n => (n < 10 ? '0' : '') + n;
const peso = n => '₱' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const signed = n => (n < 0 ? '− ' : '+ ') + peso(n);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const val = id => (document.getElementById(id)?.value ?? '').trim();
const shortDate = md => { const [m, d] = md.split('-').map(Number); return `${MONTHS[m - 1]} ${d}`; };
const dayLabel = md => {
  const today = TODAY.slice(5);
  const y = new Date(TODAY); y.setDate(y.getDate() - 1);
  const yesterday = pad2(y.getMonth() + 1) + '-' + pad2(y.getDate());
  if (md === today) return `Today · ${shortDate(md)}`;
  if (md === yesterday) return `Yesterday · ${shortDate(md)}`;
  return shortDate(md);
};
const cleanDigits = s => String(s ?? '').replace(/\D/g, '').slice(0, 16);
const formatCardNum = (num, show) => {
  const d = cleanDigits(num || '4532891023414821').padEnd(16, '0');
  if (show) return `${d.slice(0, 4)} ${d.slice(4, 8)} ${d.slice(8, 12)} ${d.slice(12, 16)}`;
  return `•••• •••• •••• ${d.slice(12, 16)}`;
};

/* ---------- Icons (one 1.5px line family with explicit HTML width/height fallback) ---------- */
const icon = (d, cls = 'w-5 h-5', sz = 18) => `<svg width="${sz}" height="${sz}" class="${cls} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  today: '<path d="M4 5h16v15H4z"/><path d="M4 9h16M9 3v4M15 3v4"/>',
  ledger: '<path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  import: '<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>',
  bills: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  trash: '<path d="M5 7h14M10 11v6M14 11v6M7 7l1 13h8l1-13M9 7V4h6v3"/>',
  chevron: '<path d="m9 5 7 7-7 7"/>',
  eye: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>',
  eyeOff: '<path d="M3 3l18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a16 16 0 0 1-3.2 4.3"/><path d="M6.6 6.6C4 8.3 2 12 2 12s3.6 7 10 7a10.6 10.6 0 0 0 5.4-1.4"/>',
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  copy: '<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  card: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/>'
};

/* ---------- Philippine Bank & Digital Wallet Card Styles (inspired by reference gallery) ---------- */
const CARD_STYLES = [
  { id: 'bdo-gold', group: 'Credit & Bank Cards', bank: 'BDO', tier: 'Gold', net: 'mc', bg: '#5C4922', accent: '#C8A862', light: false, motif: 'grid' },
  { id: 'bdo-plat', group: 'Credit & Bank Cards', bank: 'BDO', tier: 'Platinum', net: 'mc', bg: '#1E293B', accent: '#64748B', light: false, motif: 'grid' },
  { id: 'bpi-gold', group: 'Credit & Bank Cards', bank: 'BPI', tier: 'Gold Rewards', net: 'mc', bg: '#614B20', accent: '#CCA95E', light: false, motif: 'crest' },
  { id: 'bpi-plat', group: 'Credit & Bank Cards', bank: 'BPI', tier: 'Platinum Rewards', net: 'mc', bg: '#223042', accent: '#64748B', light: false, motif: 'rings' },
  { id: 'ew-gold', group: 'Credit & Bank Cards', bank: 'eastwest', tier: 'Gold', net: 'jcb', bg: '#5E4A24', accent: '#D1AE66', light: false, motif: 'ribbon' },
  { id: 'ew-plat', group: 'Credit & Bank Cards', bank: 'eastwest', tier: 'Platinum', net: 'jcb', bg: '#232936', accent: '#64748B', light: false, motif: 'ribbon' },
  { id: 'mb-gold', group: 'Credit & Bank Cards', bank: 'Metrobank', tier: 'Gold', net: 'mc', bg: '#594520', accent: '#C7A258', light: false, motif: 'wave' },
  { id: 'mb-plat', group: 'Credit & Bank Cards', bank: 'Metrobank', tier: 'Platinum', net: 'mc', bg: '#1E2B3C', accent: '#64748B', light: false, motif: 'wave' },
  { id: 'rcbc-gold', group: 'Credit & Bank Cards', bank: 'RCBC', tier: 'Hexagon Gold', net: 'mc', bg: '#584622', accent: '#C6A35B', light: false, motif: 'hex' },
  { id: 'rcbc-plat', group: 'Credit & Bank Cards', bank: 'RCBC', tier: 'Visa Platinum', net: 'visa', bg: '#0B1324', accent: '#3698D4', light: false, motif: 'horizon' },
  { id: 'ub-pearl', group: 'Credit & Bank Cards', bank: 'UnionBank', tier: 'Platinum', net: 'mc', bg: '#E6ECF5', accent: '#8C9BAE', light: true, motif: 'pillar' },
  { id: 'maya-black', group: 'Digital Banks & E-Wallets', bank: 'maya', tier: 'Black Virtual', net: 'visa', bg: '#0B0F19', accent: '#2D3A4B', light: false, motif: 'rings' },
  { id: 'gotyme', group: 'Digital Banks & E-Wallets', bank: 'GoTyme', tier: 'Visa Debit', net: 'visa', bg: '#1E293B', accent: '#1498B5', light: false, motif: 'wave' },
  { id: 'cimb', group: 'Digital Banks & E-Wallets', bank: 'CIMB', tier: 'Virtual Debit', net: 'mc', bg: '#5A1827', accent: '#C82347', light: false, motif: 'ribbon' },
  { id: 'gcash', group: 'Digital Banks & E-Wallets', bank: 'GCash', tier: 'Mastercard', net: 'mc', bg: '#0B1E3B', accent: '#2B6CB0', light: false, motif: 'wave' },
  { id: 'cash', group: 'Digital Banks & E-Wallets', bank: 'Cash', tier: 'Passbook Gold', net: 'cash', bg: '#5C4922', accent: '#C8A862', light: false, motif: 'grid' }
];
const getCardStyle = id => CARD_STYLES.find(s => s.id === id) || CARD_STYLES[0];

const emvChipSvg = (silver = false) => `<svg width="34" height="24" viewBox="0 0 34 24" fill="none" aria-hidden="true">
  <rect x="0.5" y="0.5" width="33" height="23" rx="4" fill="${silver ? '#CBD5E1' : '#D4B475'}" stroke="${silver ? '#94A3B8' : '#A38343'}"/>
  <path d="M11 1v22M23 1v22M1 9h10M23 9h10M1 15h10M23 15h10" stroke="${silver ? '#64748B' : '#7C5E26'}" stroke-width="1"/>
</svg>`;

const nfcSvg = (light = false) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="${light ? '#334155' : '#CBD5E1'}" stroke-width="1.75" stroke-linecap="round" aria-hidden="true">
  <path d="M8.5 14.5a4 4 0 0 0 0-5M11.5 17a7.5 7.5 0 0 0 0-10M14.5 19.5a11 11 0 0 0 0-15"/>
</svg>`;

const netBadgeSvg = (net, light = false) => {
  if (net === 'mc') return `<svg width="36" height="22" viewBox="0 0 36 22" fill="none" aria-hidden="true"><circle cx="14" cy="11" r="8.5" fill="#EB001B" fill-opacity="0.9"/><circle cx="22" cy="11" r="8.5" fill="#F79E1B" fill-opacity="0.9"/></svg>`;
  if (net === 'jcb') return `<svg width="36" height="22" viewBox="0 0 36 22" fill="none" aria-hidden="true"><rect x="3" y="3" width="9" height="16" rx="2.5" fill="#0066B2"/><rect x="13.5" y="3" width="9" height="16" rx="2.5" fill="#C82347"/><rect x="24" y="3" width="9" height="16" rx="2.5" fill="#15803D"/></svg>`;
  if (net === 'visa') return `<svg width="38" height="22" viewBox="0 0 38 22" fill="none" aria-hidden="true"><rect x="1" y="2" width="36" height="18" rx="3" stroke="${light ? '#0F172A' : '#FFFFFF'}" stroke-opacity="0.35"/><path d="M8 7l2.5 8L13 7M16 7v8M24 7.5c-1-.4-2.5-.3-2.5 1 0 1.8 3 1.4 3 3.5 0 1.6-1.8 2.2-3.2 1.7M27.5 15L30 7l2.5 8M28.3 12.5h3.4" stroke="${light ? '#0F172A' : '#FFFFFF'}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  return `<svg width="36" height="22" viewBox="0 0 36 22" fill="none" aria-hidden="true"><rect x="2" y="3" width="32" height="16" rx="3" stroke="${light ? '#0F172A' : '#FFFFFF'}" stroke-opacity="0.45"/><circle cx="18" cy="11" r="4" stroke="${light ? '#0F172A' : '#FFFFFF'}" stroke-width="1.4"/></svg>`;
};

const motifSvg = st => {
  const c = st.accent;
  if (st.motif === 'grid') return `<svg width="110" height="80" viewBox="0 0 110 80" fill="none" class="absolute right-0 bottom-0 opacity-25 pointer-events-none" aria-hidden="true"><rect x="18" y="8" width="42" height="64" rx="6" fill="${c}"/><rect x="48" y="22" width="54" height="44" rx="6" fill="${c}"/></svg>`;
  if (st.motif === 'hex') return `<svg width="110" height="80" viewBox="0 0 110 80" fill="none" class="absolute right-2 bottom-1 opacity-30 pointer-events-none" aria-hidden="true"><polygon points="55,6 92,26 92,62 55,78 18,62 18,26" fill="${c}"/></svg>`;
  if (st.motif === 'ribbon') return `<svg width="110" height="80" viewBox="0 0 110 80" fill="none" class="absolute right-0 bottom-0 opacity-25 pointer-events-none" aria-hidden="true"><path d="M10 80 C35 30, 75 20, 110 5 L110 80 Z" fill="${c}"/></svg>`;
  if (st.motif === 'horizon') return `<svg width="110" height="80" viewBox="0 0 110 80" fill="none" class="absolute right-0 bottom-0 opacity-30 pointer-events-none" aria-hidden="true"><path d="M0 75 Q55 25 110 55 L110 80 L0 80 Z" fill="${c}"/></svg>`;
  if (st.motif === 'pillar') return `<svg width="110" height="80" viewBox="0 0 110 80" fill="none" class="absolute right-4 top-0 opacity-30 pointer-events-none" aria-hidden="true"><rect x="42" y="0" width="28" height="68" rx="14" fill="${c}"/></svg>`;
  if (st.motif === 'rings') return `<svg width="110" height="80" viewBox="0 0 110 80" fill="none" class="absolute right-0 bottom-0 opacity-25 pointer-events-none" aria-hidden="true"><circle cx="75" cy="45" r="34" stroke="${c}" stroke-width="6"/><circle cx="75" cy="45" r="20" stroke="${c}" stroke-width="3"/></svg>`;
  return `<svg width="110" height="80" viewBox="0 0 110 80" fill="none" class="absolute right-0 bottom-0 opacity-25 pointer-events-none" aria-hidden="true"><path d="M0 65 Q50 20 110 35 L110 80 L0 80 Z" fill="${c}"/></svg>`;
};

const bankBrandHtml = (st, customName) => {
  const txt = st.light ? 'text-ink' : 'text-white';
  const sub = st.light ? 'text-ink-2' : 'text-white/80';
  const label = esc(customName || st.bank);
  if (st.bank === 'eastwest') {
    return `<span class="inline-flex items-center gap-1.5 font-semibold text-base tracking-tight ${txt}">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true"><polygon points="8,1 15,8 8,15 1,8" fill="#DB2777"/><circle cx="8" cy="8" r="2.2" fill="#FBBF24"/></svg>${label}</span>`;
  }
  if (st.bank === 'BPI') {
    return `<span class="inline-flex items-center gap-1.5 font-bold text-base tracking-tight ${txt}">
      <span class="px-1.5 py-0.5 rounded-[4px] border ${st.light ? 'border-ink/30' : 'border-white/30'} text-xs font-semibold">BPI</span>${customName && customName !== 'BPI' ? `<span class="font-medium text-sm ${sub}">${esc(customName)}</span>` : ''}</span>`;
  }
  if (st.bank === 'RCBC') {
    return `<span class="inline-flex items-center gap-1.5 font-bold text-sm tracking-tight ${txt}">
      <span class="px-1.5 py-0.5 rounded-[4px] border ${st.light ? 'border-ink/30' : 'border-white/35'}">RCBC</span>${customName && customName !== 'RCBC' ? `<span class="font-medium ${sub}">${esc(customName)}</span>` : ''}</span>`;
  }
  if (st.bank === 'UnionBank') {
    return `<span class="inline-flex items-center gap-1.5 font-bold text-sm tracking-tight ${txt}">
      <span class="font-extrabold">UB</span> <span class="font-medium ${sub}">${label}</span></span>`;
  }
  return `<span class="font-bold text-base tracking-tight ${txt}">${label}</span>`;
};

/* ---------- Shared class vocabulary ---------- */
const C = {
  card: 'bg-card border border-line rounded-card',
  btn: 'inline-flex items-center justify-center gap-1.5 h-10 px-4 rounded-ctl bg-ink text-card text-sm font-medium hover:bg-ink-2 active:scale-[0.98] transition-[transform,background-color] duration-100 cursor-pointer',
  btn2: 'inline-flex items-center justify-center gap-1.5 h-10 px-4 rounded-ctl bg-card text-ink border border-line text-sm font-medium hover:bg-subtle hover:border-ink/30 active:scale-[0.98] transition-[transform,background-color,border-color] duration-100 cursor-pointer',
  btnDanger: 'inline-flex items-center justify-center gap-1.5 h-10 px-4 rounded-ctl bg-alert text-card text-sm font-medium hover:opacity-90 active:scale-[0.98] transition-transform duration-100 cursor-pointer',
  link: 'text-sm font-medium text-ink-2 hover:text-ink underline-offset-4 hover:underline cursor-pointer',
  iconBtn: 'inline-flex items-center justify-center w-8 h-8 rounded-ctl text-mute hover:text-ink hover:bg-subtle cursor-pointer',
  label: 'block text-sm font-medium text-ink mb-1.5',
  input: 'w-full h-10 px-3 rounded-ctl bg-card border border-line text-[15px] text-ink placeholder:text-mute focus:outline-none focus:border-ink focus:ring-1 focus:ring-ink aria-[invalid=true]:border-alert aria-[invalid=true]:ring-1 aria-[invalid=true]:ring-alert',
  cardTitle: 'text-base font-semibold text-ink tracking-[-0.01em]',
  meta: 'text-xs text-mute',
  h1: 'text-[22px] md:text-[24px] leading-tight font-semibold text-ink tracking-[-0.015em] text-balance'
};

/* ---------- State & Local-Only Card Vault ---------- */
const DEFAULT_CARDS = {
  1: { style: 'gcash', num: '5399640288104821', exp: '08/29', cvv: '418', holder: 'JUAN DELA CRUZ' },
  2: { style: 'maya-black', num: '4532710499201104', exp: '11/28', cvv: '903', holder: 'JUAN DELA CRUZ' },
  3: { style: 'gotyme', num: '4288190033417762', exp: '04/30', cvv: '625', holder: 'JUAN DELA CRUZ' },
  4: { style: 'bdo-plat', num: '5412750019283390', exp: '06/29', cvv: '712', holder: 'JUAN DELA CRUZ' }
};

function ensureCardMeta(w, idx = 0) {
  const def = DEFAULT_CARDS[w.id] || {
    style: CARD_STYLES[idx % CARD_STYLES.length].id,
    num: '453289102341' + String(1000 + (w.id * 317) % 8999),
    exp: '09/29',
    cvv: String(100 + (w.id * 73) % 899),
    holder: 'JUAN DELA CRUZ'
  };
  const guessStyle = /gcash/i.test(w.n) ? 'gcash' : /maya/i.test(w.n) ? 'maya-black' : /gotyme/i.test(w.n) ? 'gotyme' : /bdo/i.test(w.n) ? 'bdo-gold' : /bpi/i.test(w.n) ? 'bpi-plat' : /eastwest/i.test(w.n) ? 'ew-gold' : /metrobank/i.test(w.n) ? 'mb-plat' : /rcbc/i.test(w.n) ? 'rcbc-plat' : /unionbank/i.test(w.n) ? 'ub-pearl' : /cimb/i.test(w.n) ? 'cimb' : /cash/i.test(w.n) ? 'cash' : def.style;
  return {
    ...w,
    style: w.style || guessStyle,
    num: w.num || def.num,
    exp: w.exp || def.exp,
    cvv: w.cvv || def.cvv,
    holder: w.holder || def.holder
  };
}

const seed = () => ({
  view: 'login', wid: 0, fw: 0, editWid: 0, modal: '', pr: null, raw: '', draft: {}, errors: {}, revealed: {}, copiedId: 0, n: 20,
  w: [
    ensureCardMeta({ id: 1, n: 'GCash', b: 1200, style: 'gcash' }, 0),
    ensureCardMeta({ id: 2, n: 'Maya', b: 2100, style: 'maya-black' }, 1),
    ensureCardMeta({ id: 3, n: 'GoTyme', b: 800, style: 'gotyme' }, 2),
    ensureCardMeta({ id: 4, n: 'Cash', b: 150, style: 'cash' }, 3)
  ],
  t: [
    { id: 1, d: '09-30', s: 'Jollibee', c: 'Food', w: 1, a: -189 },
    { id: 2, d: '09-30', s: 'Salary', c: 'Income', w: 2, a: 12000 },
    { id: 3, d: '09-29', s: 'Load', c: 'Load', w: 1, a: -50 },
    { id: 4, d: '09-29', s: 'Grab', c: 'Transport', w: 1, a: -140 }
  ],
  b: [{ id: 1, n: 'Wi-Fi', a: 1299, d: 'Oct 5' }, { id: 2, n: 'Spotify', a: 200, d: 'Oct 9' }]
});
let S = seed();
try {
  const saved = JSON.parse(localStorage.getItem('onewallet'));
  if (saved) {
    S = { ...S, ...saved, revealed: {}, copiedId: 0 };
    if (Array.isArray(S.w)) S.w = S.w.map((w, i) => ensureCardMeta(w, i));
  }
} catch (e) {}

const walletName = id => esc(S.w.find(x => x.id == id)?.n ?? 'Deleted wallet');
const total = () => S.w.reduce((s, w) => s + w.b, 0);
const reserved = () => S.b.reduce((s, b) => s + b.a, 0);
const daysLeft = () => Math.max(1, Math.round((new Date(PAYDAY) - new Date(TODAY)) / 864e5));
const free = () => Math.max(0, total() - reserved());
const perDay = () => free() / daysLeft();

/* ---------- Navigation & Privacy Controls ---------- */
function go(v) {
  S.revealed = {}; // Auto-mask all private card details when navigating
  if (location.hash === '#' + v) { S.view = v; S.wid = 0; S.pr = null; R(); }
  else location.hash = v;
}
function signIn() { location.replace('#today'); }          // one-way door: Back never returns to sign-in
function signOut() { S.modal = ''; S.revealed = {}; location.replace('#login'); }
function openModal(m, wid = 0) {
  S.modal = m; S.editWid = wid; S.draft = {}; S.errors = {};
  if (m === 'wallet' && wid) {
    const w = S.w.find(x => x.id == wid);
    if (w) S.draft = { wnm: w.n, wb: String(w.b), wstyle: w.style, wnum: w.num, wexp: w.exp, wcvv: w.cvv, wholder: w.holder };
  } else if (m === 'wallet') {
    S.draft = { wstyle: 'bdo-gold', wexp: '08/29', wholder: 'JUAN DELA CRUZ' };
  }
  R();
}
function closeModal() { S.modal = ''; S.editWid = 0; S.draft = {}; S.errors = {}; R(); }
let keepWallet = false;
function openWallet(id) { S.wid = id; if (S.view !== 'wallets') { keepWallet = true; go('wallets'); } else R(); }

function toggleReveal(id) {
  S.revealed[id] = !S.revealed[id];
  R();
}
function maskAllCards() {
  S.revealed = {};
  R();
}
function copyCardNum(id) {
  const w = S.w.find(x => x.id == id);
  if (!w) return;
  try { navigator.clipboard?.writeText(cleanDigits(w.num)); } catch (e) {}
  S.copiedId = id;
  R();
  setTimeout(() => { if (S.copiedId === id) { S.copiedId = 0; R(); } }, 1800);
}
function pickCardStyle(styleId) {
  const st = getCardStyle(styleId);
  const curName = document.getElementById('wnm')?.value ?? S.draft.wnm ?? '';
  const isPresetName = !curName || CARD_STYLES.some(x => x.bank.toLowerCase() === curName.toLowerCase() || `${x.bank} ${x.tier}`.toLowerCase() === curName.toLowerCase());
  S.draft = {
    ...S.draft,
    wnm: isPresetName ? `${st.bank}${st.tier && !/Mastercard|Debit|Passbook/i.test(st.tier) ? ' ' + st.tier : ''}` : curName,
    wb: document.getElementById('wb')?.value ?? S.draft.wb ?? '',
    wnum: document.getElementById('wnum')?.value ?? S.draft.wnum ?? '',
    wexp: document.getElementById('wexp')?.value ?? S.draft.wexp ?? '08/29',
    wcvv: document.getElementById('wcvv')?.value ?? S.draft.wcvv ?? '',
    wholder: document.getElementById('wholder')?.value ?? S.draft.wholder ?? 'JUAN DELA CRUZ',
    wstyle: styleId
  };
  R();
}

/* ---------- Mutations ---------- */
function addTx(w, a, s, c) { S.t.unshift({ id: ++S.n, d: TODAY.slice(5), s, c, w: +w, a }); const wl = S.w.find(z => z.id == w); if (wl) wl.b += a; }
function delTx(id) { const t = S.t.find(x => x.id == id); if (!t) return; const wl = S.w.find(z => z.id == t.w); if (wl) wl.b -= t.a; S.t = S.t.filter(x => x.id != id); R(); }
function delBill(id) { S.b = S.b.filter(x => x.id != id); R(); }

function fail(errors, fields) { S.errors = errors; S.draft = { ...S.draft, ...Object.fromEntries(fields.map(f => [f, val(f)])) }; R(); }

function saveTx() {
  const a = parseFloat(val('am'));
  if (!(a > 0)) return fail({ am: 'Enter an amount greater than ₱0.' }, ['ty', 'am', 'mw', 'mc', 'nt']);
  addTx(val('mw'), +val('ty') * a, val('nt') || (val('ty') === '1' ? 'Income' : 'Expense'), val('mc'));
  closeModal();
}
function saveWallet() {
  const n = val('wnm'), b = val('wb') === '' ? 0 : parseFloat(val('wb'));
  const style = S.draft.wstyle || 'bdo-gold';
  const rawDigits = cleanDigits(val('wnum'));
  const num = rawDigits.length >= 4 ? rawDigits.padStart(16, '453289102341') : ('453289102341' + String(1000 + Math.floor(Math.random() * 8999)));
  const exp = val('wexp') || '08/29';
  const cvv = (val('wcvv').replace(/\D/g, '').slice(0, 4)) || '418';
  const holder = (val('wholder') || 'JUAN DELA CRUZ').toUpperCase();
  const e = {};
  if (!n) e.wnm = 'Give this wallet or card a name.';
  if (isNaN(b)) e.wb = 'Enter a number, or leave it blank for ₱0.';
  if (Object.keys(e).length) return fail(e, ['wnm', 'wb', 'wnum', 'wexp', 'wcvv', 'wholder']);
  if (S.editWid) {
    const existing = S.w.find(x => x.id == S.editWid);
    if (existing) Object.assign(existing, { n, b, style, num, exp, cvv, holder });
  } else {
    S.w.push({ id: ++S.n, n, b, style, num, exp, cvv, holder });
  }
  closeModal();
}
function saveBill() {
  const n = val('bn'), a = parseFloat(val('ba')), d = val('bd');
  const e = {};
  if (!n) e.bn = 'Name the bill.';
  if (!(a > 0)) e.ba = 'Enter an amount greater than ₱0.';
  if (Object.keys(e).length) return fail(e, ['bn', 'ba', 'bd']);
  S.b.push({ id: ++S.n, n, a, d: d || 'No due date' });
  closeModal();
}
function saveReconcile() {
  const w = S.w.find(x => x.id == S.wid), real = parseFloat(val('rb'));
  if (isNaN(real)) return fail({ rb: 'Enter the balance your app shows.' }, ['rb']);
  const diff = Math.round((real - w.b) * 100) / 100;
  if (diff) addTx(w.id, diff, 'Balance correction', 'Others');
  closeModal();
}
function resetData() { S = { ...seed(), view: S.view }; try { localStorage.removeItem('onewallet'); } catch (e) {} closeModal(); go('today'); }

/* ---------- Alert import ---------- */
const SAMPLES = [
  'GCash: You have paid ₱189.00 to Jollibee. Ref 5012 884 991.',
  'Maya: You received ₱1,500.00 from Juan Dela Cruz.',
  'GoTyme: You sent ₱350.00 to Grab. Ref 88231.'
];
function fillSample(i) { S.raw = SAMPLES[i]; S.pr = null; R(); document.getElementById('raw')?.focus(); }
function readAlert() {
  const x = S.raw = val('raw');
  if (!x) { S.pr = { err: 'Paste an alert first, or try one of the samples.' }; return R(); }
  const amt = (x.match(/(?:₱|PHP\s?)\s?([\d,]+(?:\.\d+)?)/i) || [])[1];
  if (!amt) { S.pr = { err: 'We couldn’t find a peso amount. Alerts usually look like “paid ₱189.00 to …”.' }; return R(); }
  const isIn = /received|credited|cash[- ]?in|deposit/i.test(x), isOut = /paid|sent|transferred|purchase|debited|cash[- ]?out/i.test(x);
  const s = (x.match(/(?:to|from|at)\s+([A-Z][\w&' -]*?)(?:\.|,|\s+Ref|$)/) || [])[1] || 'Unknown';
  const w = S.w.find(z => new RegExp(z.n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i').test(x));
  const c = isIn && !isOut ? 'Income' : /jollibee|mcdo|food|coffee|milk ?tea/i.test(x) ? 'Food' : /grab|angkas|jeep|mrt|lrt/i.test(x) ? 'Transport' : /load|globe|smart/i.test(x) ? 'Load' : /meralco|wi-?fi|water|converge/i.test(x) ? 'Bills' : 'Others';
  S.pr = { a: parseFloat(amt.replace(/,/g, '')), dir: isIn && !isOut ? 1 : -1, s, c, w: w ? w.id : S.w[0]?.id };
  R();
}
function confirmAlert() { const p = S.pr; addTx(val('pw'), p.a * p.dir, p.s, p.c); S.pr = null; S.raw = ''; go('ledger'); }

function ledgerList(list, { deletable = false, limit = Infinity, empty = 'No entries yet.' } = {}) {
  const rows = list.slice(0, limit);
  if (!rows.length) return `<p class="py-8 text-center ${C.meta}">${empty}</p>`;
  const groups = [];
  rows.forEach(t => { const g = groups.at(-1); if (g && g.d === t.d) g.items.push(t); else groups.push({ d: t.d, items: [t] }); });
  return groups.map(g => `<section class="mt-4 first:mt-1.5">
    <h3 class="text-xs font-semibold text-ink-2 pb-1">${dayLabel(g.d)}</h3>
    <ul>${g.items.map(t => txRow(t, deletable)).join('')}</ul>
  </section>`).join('');
}

                  <span class="block h-1 mt-1 rounded-full bg-track overflow-hidden"><span class="block h-full rounded-full bg-ink" style="width:${tot > 0 ? Math.max(0, w.b) / tot * 100 : 0}%"></span></span>
                </button>
              </li>`).join('') || `<li class="py-3 ${C.meta}">No wallets yet.</li>`}
            </ul>
            <div class="flex justify-between text-sm font-semibold pt-2 mt-2 border-t border-line"><span>Total balance</span><span class="tnum">${peso(tot)}</span></div>
          </section>

          <section class="${C.card} p-4 flex-1 flex flex-col justify-between">
            ${cardHead('Bills set aside', `<a href="#bills" class="${C.link}">Manage</a>`)}
            <ul class="divide-y divide-line/60">
              ${S.b.map(b => `<li class="flex justify-between text-sm py-2"><span><span class="font-medium text-ink">${esc(b.n)}</span> <span class="text-xs text-mute">· due ${esc(b.d)}</span></span><span class="tnum font-medium text-ink">${peso(b.a)}</span></li>`).join('') || `<li class="py-2 ${C.meta}">Nothing set aside.</li>`}
            </ul>
          </section>
        </div>
      </div>`;
  },

  wallets: () => {
    const w = S.w.find(x => x.id == S.wid);
    if (w) {
      const list = S.t.filter(t => t.w == w.id);
      const rev = !!S.revealed[w.id];
      return `
        <button type="button" class="${C.link} inline-flex items-center gap-1 mb-3 -ml-1" onclick="S.wid=0;S.revealed={};R()">${icon(I.back, 'w-4 h-4', 16)}All wallets & cards</button>
        ${pageHead(esc(w.n), 'Wallet & local card vault', `
          <button type="button" class="${C.btn2}" onclick="openModal('wallet', ${w.id})">${icon(I.card, 'w-4 h-4', 16)}Card style & info</button>
          <button type="button" class="${C.btn}" onclick="openModal('reconcile')">Correct balance</button>`)}

        <div class="grid gap-4 lg:grid-cols-[1.08fr_1fr] items-stretch mb-5">
          <section class="${C.card} overflow-hidden flex flex-col justify-between">
            ${renderCardFace(w, { revealed: rev })}
            <div class="px-5 py-3 flex flex-wrap items-center justify-between gap-2 bg-card">
              <span class="text-xs text-mute">${rev ? 'Visible on your screen only · Never sent to any server' : 'Card numbers & CVV are hidden from view'}</span>
              <button type="button" class="${C.link} inline-flex items-center gap-1.5 text-xs font-semibold" onclick="toggleReveal(${w.id})">
                ${icon(rev ? I.eyeOff : I.eye, 'w-4 h-4', 16)}${rev ? 'Hide card info' : 'Reveal card info'}
              </button>
            </div>
          </section>

          <section class="${C.card} p-5 flex flex-col justify-between">
            <div>
              <p class="text-sm font-medium text-ink-2">Recorded balance</p>
              <p class="tnum text-[36px] leading-tight font-semibold tracking-[-0.02em] my-1">${peso(w.b)}</p>
              <p class="${C.meta}">${list.length} entr${list.length === 1 ? 'y' : 'ies'} · If this differs from your ${esc(w.n)} app, choose Correct balance.</p>
            </div>
            <div class="pt-3 mt-3 border-t border-line flex items-center justify-between text-xs text-mute">
              <span>Privacy status</span>
              <span class="font-medium text-ink">Device-only local storage</span>
            </div>
          </section>
        </div>

        <section class="${C.card} p-5">
          ${cardHead('Entries')}
          ${ledgerList(list, { deletable: true, empty: `No entries for ${esc(w.n)} yet.` })}
        </section>`;
    }

    const tot = total();
    const anyRevealed = Object.values(S.revealed).some(Boolean);
    return `
      ${pageHead('Wallets & Cards', `${S.w.length} accounts · ${peso(tot)} total · Private local card vault`, `
        ${anyRevealed ? `<button type="button" class="${C.btn2}" onclick="maskAllCards()">${icon(I.eyeOff, 'w-4 h-4', 16)}Mask all</button>` : ''}
        <button type="button" class="${C.btn}" onclick="openModal('wallet')">${icon(I.plus, 'w-4 h-4', 16)}Add wallet or card</button>`)}

      <div class="flex flex-wrap items-center justify-between gap-2 pb-4 mb-4 border-b border-line text-sm text-ink-2">
        <span class="inline-flex items-center gap-2">${icon(I.lock, 'w-4 h-4', 16)}<span><strong class="font-semibold text-ink">Private to this device:</strong> Card numbers, expiry and CVV stay masked on screen and live only in this browser—never shared with other users or any database.</span></span>
        <span class="tnum text-[13px] font-medium text-mute">${anyRevealed ? 'Card info unlocked on screen' : 'All cards masked'}</span>
      </div>

      <div class="grid gap-4 md:grid-cols-2 items-stretch">
        ${S.w.map(w => {
          const count = S.t.filter(t => t.w == w.id).length;
          const rev = !!S.revealed[w.id];
          const share = tot > 0 ? Math.round(Math.max(0, w.b) / tot * 100) : 0;
          return `<article class="${C.card} overflow-hidden flex flex-col justify-between">
            ${renderCardFace(w, { revealed: rev })}
            <div class="p-4 flex flex-col gap-3">
              <div class="flex items-baseline justify-between">
                <div>
                  <span class="text-base font-semibold text-ink">${esc(w.n)}</span>
                  <span class="text-[13px] text-mute ml-1.5">· ${count} entr${count === 1 ? 'y' : 'ies'} (${share}%)</span>
                </div>
                <span class="tnum text-lg font-semibold text-ink">${peso(w.b)}</span>
              </div>
              <div class="flex flex-wrap items-center justify-between gap-2 pt-2.5 border-t border-line">
                <div class="flex items-center gap-3">
                  <button type="button" class="${C.link} inline-flex items-center gap-1 text-sm font-semibold" onclick="toggleReveal(${w.id})">
                    ${icon(rev ? I.eyeOff : I.eye, 'w-4 h-4', 16)}${rev ? 'Hide info' : 'Check card info'}
                  </button>
                  <button type="button" class="${C.link} text-sm" onclick="openModal('wallet', ${w.id})">Card style</button>
                </div>
                <button type="button" class="${C.link} inline-flex items-center gap-1 text-sm font-semibold" onclick="openWallet(${w.id})">
                  Open ledger${icon(I.chevron, 'w-4 h-4', 16)}
                </button>
              </div>
            </div>
          </article>`;
        }).join('') || `<div class="${C.card} p-8 text-center ${C.meta} md:col-span-2">Add your first wallet or card to start.</div>`}
      </div>`;
  },

  ledger: () => {
    const list = S.t.filter(t => !S.fw || t.w == S.fw);
    const chip = (id, label) => `<button type="button" role="radio" aria-checked="${S.fw == id}" class="h-8 px-3.5 rounded-full text-xs font-medium border cursor-pointer ${S.fw == id ? 'bg-ink text-card border-ink' : 'bg-card text-ink-2 border-line hover:border-ink/40 hover:text-ink'}" onclick="S.fw=${id};R()">${label}</button>`;
    return `
      ${pageHead('Ledger', `${S.t.length} recorded entries`, `<button type="button" class="${C.btn}" onclick="openModal('tx')">${icon(I.plus, 'w-4 h-4', 16)}Add entry</button>`)}
      <div role="radiogroup" aria-label="Filter by wallet" class="flex flex-wrap gap-2 mb-4">${chip(0, 'All wallets')}${S.w.map(w => chip(w.id, esc(w.n))).join('')}</div>
      <section class="${C.card} p-5">
        ${ledgerList(list, { deletable: true, empty: S.fw ? 'No entries for this wallet.' : 'No entries yet. Add one or import an alert.' })}
      </section>`;
  },

  import: () => {
    const p = S.pr;
    return `
      ${pageHead('Import alert', 'Turn a payment SMS or notification into a ledger entry')}
      <section class="${C.card} p-5 mb-5">
        <label class="${C.label}" for="raw">Paste the alert text</label>
        <textarea id="raw" rows="3" class="${C.input} h-auto py-2.5 leading-relaxed resize-y" placeholder="GCash: You have paid ₱189.00 to Jollibee. Ref 5012 884 991.">${esc(S.raw)}</textarea>
        <div class="flex flex-wrap items-center justify-between gap-3 mt-4">
          <button type="button" class="${C.btn}" onclick="readAlert()">Read alert</button>
          <div class="flex flex-wrap items-center gap-2"><span class="${C.meta}">Try a sample:</span>
            ${['GCash', 'Maya', 'GoTyme'].map((n, i) => `<button type="button" class="h-7 px-3 rounded-full text-xs font-medium border border-line bg-subtle/60 hover:border-ink/40 cursor-pointer" onclick="fillSample(${i})">${n}</button>`).join('')}
          </div>
        </div>
      </section>
      ${p ? p.err ? `
        <div role="alert" class="${C.card} border-alert p-4 text-sm text-alert">${esc(p.err)}</div>` : `
        <section class="${C.card} p-5" aria-labelledby="found">
          <h2 id="found" class="${C.cardTitle} mb-3">Parsed transaction</h2>
          <dl class="tnum text-sm divide-y divide-line border-y border-line mb-5">
            <div class="flex justify-between py-2"><dt class="text-ink-2">Amount</dt><dd class="font-semibold ${p.dir > 0 ? 'text-gain' : 'text-ink'}">${signed(p.a * p.dir)}</dd></div>
            <div class="flex justify-between py-2"><dt class="text-ink-2">Type</dt><dd>${p.dir > 0 ? 'Income' : 'Expense'}</dd></div>
            <div class="flex justify-between py-2"><dt class="text-ink-2">${p.dir > 0 ? 'From' : 'To'}</dt><dd class="font-medium">${esc(p.s)}</dd></div>
            <div class="flex justify-between py-2"><dt class="text-ink-2">Category</dt><dd>${esc(p.c)}</dd></div>
          </dl>
          <div class="flex flex-wrap items-end gap-3">
            <div class="flex-1 min-w-[200px]">${field('pw', 'Add to wallet', `<select id="pw" class="${C.input}">${walletOptions(p.w)}</select>`).replace('mb-4', 'mb-0')}</div>
            <button type="button" class="${C.btn}" onclick="confirmAlert()">Add to ledger</button>
          </div>
        </section>` : ''}`;
  },

  bills: () => `
    ${pageHead('Bills', `${peso(reserved())} set aside until payday`, `<button type="button" class="${C.btn}" onclick="openModal('bill')">${icon(I.plus, 'w-4 h-4', 16)}Set aside a bill</button>`)}
    <section class="${C.card}">
      <ul class="divide-y divide-line">
        ${S.b.map(b => `<li class="flex items-center gap-4 px-5 py-3.5">
          <span class="flex-1 min-w-0"><span class="block text-sm font-semibold text-ink">${esc(b.n)}</span><span class="block ${C.meta}">Due ${esc(b.d)}</span></span>
          <span class="tnum text-sm font-semibold text-ink">${peso(b.a)}</span>
          <button type="button" class="${C.iconBtn} -mr-1.5" onclick="delBill(${b.id})" aria-label="Remove ${esc(b.n)}">${icon(I.trash, 'w-4 h-4', 16)}</button>
        </li>`).join('') || `<li class="p-8 text-center ${C.meta}">No bills set aside. Add rent, Wi-Fi or subscriptions so your daily amount stays honest.</li>`}
      </ul>
      ${S.b.length ? `<div class="flex justify-between px-5 py-3.5 border-t border-line text-sm font-semibold"><span>Total set aside</span><span class="tnum">${peso(reserved())}</span></div>` : ''}
    </section>`,

  insights: () => {
    const byCat = {};
    S.t.filter(t => t.a < 0 && t.s !== 'Balance correction').forEach(t => byCat[t.c] = (byCat[t.c] || 0) - t.a);
    const inc = S.t.filter(t => t.a > 0 && t.s !== 'Balance correction').reduce((s, t) => s + t.a, 0);
    const out = Object.values(byCat).reduce((s, v) => s + v, 0);
    const max = Math.max(1, ...Object.values(byCat));
    const bar = (pct, cls = 'bg-ink') => `<span class="block h-1.5 rounded-full bg-track overflow-hidden"><span class="block h-full rounded-full ${cls}" style="width:${pct}%"></span></span>`;
    return `
      ${pageHead('Insights', 'Cashflow & category breakdown this period')}
      <div class="grid gap-4 lg:grid-cols-2 items-start">
        <section class="${C.card} p-5">
          ${cardHead('Money in vs out')}
          <div class="mt-3 space-y-4 tnum text-sm">
            <div><div class="flex justify-between mb-1.5"><span class="text-ink-2">Money in</span><span class="font-semibold text-gain">${peso(inc)}</span></div>${bar(inc ? 100 : 0, 'bg-gain')}</div>
            <div><div class="flex justify-between mb-1.5"><span class="text-ink-2">Money out</span><span class="font-semibold text-ink">${peso(out)}</span></div>${bar(inc ? Math.min(100, out / inc * 100) : out ? 100 : 0)}</div>
          </div>
          <p class="${C.meta} pt-3 mt-4 border-t border-line">${inc ? `You’ve spent ${Math.round(out / inc * 100)}% of recorded income this period.` : 'No income recorded yet.'}</p>
        </section>
        <section class="${C.card} p-5">
          ${cardHead('Spending by category')}
          <ul class="mt-3 space-y-3 tnum text-sm">
            ${Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<li><div class="flex justify-between mb-1.5"><span class="text-ink-2">${esc(k)}</span><span class="font-semibold text-ink">${peso(v)}</span></div>${bar(v / max * 100)}</li>`).join('') || `<li class="${C.meta} py-4">No spending recorded yet.</li>`}
          </ul>
          <p class="${C.meta} pt-3 mt-4 border-t border-line">Total categorized outflow: <span class="tnum font-semibold text-ink">${peso(out)}</span></p>
        </section>
      </div>`;
  },

  settings: () => `
    ${pageHead('Settings', 'Workspace & browser storage')}
    <section class="${C.card} divide-y divide-line">
      <div class="flex flex-wrap items-center justify-between gap-3 p-5">
        <div><p class="text-sm font-semibold text-ink">Sign out</p><p class="${C.meta}">Close workspace session. Your data stays saved in this browser.</p></div>
        <button type="button" class="${C.btn2}" onclick="signOut()">Sign out</button>
      </div>
      <div class="flex flex-wrap items-center justify-between gap-3 p-5">
        <div><p class="text-sm font-semibold text-ink">Reset demo data</p><p class="${C.meta}">Replace everything with the original sample wallets, entries and bills.</p></div>
        <button type="button" class="${C.btn2} !border-alert/50 !text-alert hover:!bg-alert/5" onclick="openModal('reset')">Reset…</button>
      </div>
    </section>`,

  help: () => `
    ${pageHead('Help', 'How One Wallet computes your daily allowance')}
    <div class="grid gap-4 lg:grid-cols-2 items-start">
      <section class="${C.card} p-5">
        ${cardHead('How the daily amount works')}
        <ol class="mt-2 space-y-2.5 text-sm text-ink-2 list-decimal pl-5">
          <li>Add each wallet with the balance its app shows right now.</li>
          <li>Set aside bills due before your next payday.</li>
          <li>What’s left, divided by the days until payday, is your safe amount per day.</li>
        </ol>
      </section>
      <section class="${C.card} p-5">
        ${cardHead('Common questions')}
        <dl class="mt-2 space-y-3 text-sm">
          <div><dt class="font-semibold text-ink">Does it connect to my bank?</dt><dd class="text-ink-2">No. It only reads alert text you paste in.</dd></div>
          <div><dt class="font-semibold text-ink">Are my card numbers public or stored in a database?</dt><dd class="text-ink-2">Never. Card numbers, expiry dates and CVV codes are masked on screen by default and stored only in your browser’s local storage on this device.</dd></div>
          <div><dt class="font-semibold text-ink">A balance looks wrong.</dt><dd class="text-ink-2">Open the wallet and choose Correct balance. We add an entry for the difference so your history stays traceable.</dd></div>
        </dl>
      </section>
    </div>`,

  more: () => `
    ${pageHead('More', 'All workspace sections')}
    <section class="${C.card}">
      <ul class="divide-y divide-line">
        ${[['wallets', 'Wallets'], ['insights', 'Insights'], ['settings', 'Settings'], ['help', 'Help']].map(([k, l]) => `<li><a href="#${k}" class="flex items-center justify-between px-5 py-3.5 text-sm font-medium hover:bg-subtle/60">${l}<span class="text-mute">${icon(I.chevron, 'w-4 h-4', 16)}</span></a></li>`).join('')}
      </ul>
    </section>`
};

/* ---------- Shell & render ---------- */
const NAV = [['today', 'Today'], ['wallets', 'Wallets'], ['ledger', 'Ledger'], ['import', 'Import alert'], ['bills', 'Bills'], ['insights', 'Insights']];
const NAV2 = [['settings', 'Settings'], ['help', 'Help']];
const TABS = [['today', 'Today', I.today], ['ledger', 'Ledger', I.ledger], ['import', 'Import', I.import], ['bills', 'Bills', I.bills], ['more', 'More', I.menu]];
const MORE_GROUP = ['more', 'wallets', 'insights', 'settings', 'help'];

const navLink = ([k, l]) => {
  const on = S.view === k;
  return `<a href="#${k}" ${on ? 'aria-current="page"' : ''} class="relative flex items-center h-9 mx-3 px-3 rounded-ctl text-sm ${on ? 'bg-subtle font-semibold text-ink' : 'text-ink-2 hover:text-ink hover:bg-subtle/50'}">
    ${on ? '<span class="absolute left-0 top-1.5 bottom-1.5 w-[3px] rounded-r-full bg-ink" aria-hidden="true"></span>' : ''}${l}</a>`;
};

function R() {
  try { localStorage.setItem('onewallet', JSON.stringify({ w: S.w, t: S.t, b: S.b, n: S.n })); } catch (e) {}
  const app = document.getElementById('app');
  if (S.view === 'login') { app.innerHTML = V.login(); document.title = 'Sign in · One Wallet'; return; }

  const label = [...NAV, ...NAV2, ['more', 'More']].find(n => n[0] === S.view)?.[1] ?? 'One Wallet';
  document.title = `${label} · One Wallet`;

  app.innerHTML = `
    <div class="min-h-dvh md:grid md:grid-cols-[232px_1fr]">
      <aside class="max-md:hidden sticky top-0 h-dvh flex flex-col bg-card border-r border-line">
        <a href="#today" class="flex items-center gap-2.5 px-6 pt-6 pb-5">
          <span class="w-7 h-7 rounded-ctl bg-ink flex items-center justify-center" aria-hidden="true"><span class="w-3 h-2 rounded-[2px] bg-card"></span></span>
          <span class="text-base font-semibold tracking-[-0.01em]">One Wallet</span>
        </a>
        <nav aria-label="Main" class="flex flex-col gap-0.5">${NAV.map(navLink).join('')}</nav>
        <nav aria-label="Account" class="mt-auto flex flex-col gap-0.5 pb-3">${NAV2.map(navLink).join('')}</nav>
        <div class="border-t border-line px-6 py-3.5 flex items-center justify-between text-xs text-mute">
          <span>Next payday</span>
          <span class="tnum font-semibold text-ink">${shortDate(PAYDAY.slice(5))}</span>
        </div>
      </aside>

      <div class="min-w-0">
        <header class="md:hidden flex items-center justify-between px-4 py-3 bg-card border-b border-line">
          <span class="flex items-center gap-2"><span class="w-6 h-6 rounded-[6px] bg-ink flex items-center justify-center" aria-hidden="true"><span class="w-2.5 h-2 rounded-[1px] bg-card"></span></span><span class="text-sm font-semibold">One Wallet</span></span>
          <span class="${C.meta}">Payday ${shortDate(PAYDAY.slice(5))}</span>
        </header>
        <main id="main" class="w-full max-w-[1208px] mx-auto px-4 pt-5 pb-28 md:px-8 md:pt-7 md:pb-12">${V[S.view]()}</main>
      </div>
    </div>

    <nav aria-label="Main" class="md:hidden fixed inset-x-0 bottom-0 z-30 bg-card border-t border-line grid grid-cols-5 pb-[env(safe-area-inset-bottom)]">
      ${TABS.map(([k, l, ic]) => {
        const on = S.view === k || (k === 'more' && MORE_GROUP.includes(S.view));
        return `<a href="#${k}" ${on ? 'aria-current="page"' : ''} class="flex flex-col items-center justify-center gap-0.5 h-15 text-xs ${on ? 'text-ink font-semibold' : 'text-mute'}">
          <span class="relative">${icon(ic, 'w-5 h-5', 20)}${on ? '<span class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-3.5 h-[2px] rounded-full bg-ink" aria-hidden="true"></span>' : ''}</span>
          <span class="mt-1">${l}</span></a>`;
      }).join('')}
    </nav>

    ${S.modal ? `
      <div class="fixed inset-0 z-50 bg-ink/40 flex items-end sm:items-center justify-center sm:p-4" onclick="if(event.target===this)closeModal()">
        <div role="dialog" aria-modal="true" aria-labelledby="modal-title" class="dialog-in w-full sm:w-[500px] max-h-[90dvh] overflow-y-auto bg-card border border-line rounded-t-card sm:rounded-card p-5 sm:p-6 pb-[max(1.25rem,env(safe-area-inset-bottom))]">
          ${M[S.modal]()}
        </div>
      </div>` : ''}`;

  if (S.modal) {
    const firstErr = document.querySelector('[aria-invalid="true"]');
    (firstErr || document.querySelector('[data-autofocus]') || document.querySelector('[role="dialog"] button'))?.focus();
  }
}

/* Keep focus inside an open dialog; Escape closes it. */
window.addEventListener('keydown', e => {
  if (!S.modal) return;
  if (e.key === 'Escape') { closeModal(); return; }
  if (e.key === 'Enter' && e.target.matches('[role="dialog"] input')) { e.preventDefault(); document.querySelector('[role="dialog"] .flex.justify-end button:last-child')?.click(); return; }
  if (e.key !== 'Tab') return;
  const f = [...document.querySelectorAll('[role="dialog"] :is(button,input,select,textarea,a[href])')];
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
  else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
});

/* Old hashes from the previous version keep working. */
const ALIAS = { dash: 'today', wal: 'wallets', tx: 'ledger', imp: 'import', bill: 'bills', ins: 'insights', set: 'settings' };
function route() {
  let v = location.hash.slice(1);
  if (ALIAS[v]) { location.replace('#' + ALIAS[v]); return; }
  if (!V[v]) v = 'login';
  const changed = S.view !== v;
  S.view = v; S.modal = ''; S.pr = changed ? null : S.pr;
  if (changed) S.revealed = {}; // Auto-mask card details when changing screens
  if (changed && !keepWallet) S.wid = 0;
  keepWallet = false;
  R();
  if (changed) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
