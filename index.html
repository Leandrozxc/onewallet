/* ---------- Dynamic Dates & Formatting ---------- */
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CATEGORIES = ['Food', 'Transport', 'Load', 'Bills', 'Income', 'Others'];

const pad2 = n => (n < 10 ? '0' : '') + n;
const getToday = () => OWVault.todayISO();
const getPayday = () => OWVault.computeNextPayday(getToday(), S.paydayMode || 'bimonthly', S.customPayday || '');

const peso = n => '₱' + Math.abs(Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const signed = n => (n < 0 ? '− ' : '+ ') + peso(n);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const val = id => (document.getElementById(id)?.value ?? '').trim();
const shortDate = md => {
  if (!md) return '';
  const parts = String(md).split('-');
  const m = Number(parts.at(-2)), d = Number(parts.at(-1));
  if (!m || !d || !MONTHS[m - 1]) return String(md);
  return `${MONTHS[m - 1]} ${d}`;
};
const dayLabel = md => {
  const td = getToday().slice(5);
  const yd = OWVault.shiftDaysISO(getToday(), -1).slice(5);
  const norm = String(md || '').slice(-5);
  if (norm === td) return `Today · ${shortDate(norm)}`;
  if (norm === yd) return `Yesterday · ${shortDate(norm)}`;
  return shortDate(norm);
};
const cleanDigits = s => String(s ?? '').replace(/\D/g, '').slice(0, 16);
const formatCardNum = (w, show) => {
  if (show && w.num) {
    const d = cleanDigits(w.num).padEnd(16, '0');
    return `${d.slice(0, 4)} ${d.slice(4, 8)} ${d.slice(8, 12)} ${d.slice(12, 16)}`;
  }
  const l4 = w.last4 || cleanDigits(w.num || '4821').slice(-4) || '4821';
  return `•••• •••• •••• ${l4}`;
};

/* Persist active account workspace (stripping plaintext card secrets before storage!) */
function persistActiveAccount() {
  if (!S.accountId) return;
  try {
    const reg = OWVault.loadRegistry();
    const existing = reg[S.accountId] || {};
    const sanitizedWallets = S.w.map(w => ({
      id: w.id,
      n: w.n,
      b: w.b,
      style: w.style || 'gcash',
      last4: w.last4 || cleanDigits(w.num || '4821').slice(-4) || '4821',
      encrypted_card_vault: w.encrypted_card_vault || 'aes256gcm:local:vault'
    }));
    reg[S.accountId] = {
      ...existing,
      id: S.accountId,
      fullName: S.fullName,
      email: S.email,
      paydayMode: S.paydayMode || 'bimonthly',
      customPayday: S.customPayday || '',
      salt: S.salt,
      sbUserId: S.sbUserId || existing.sbUserId || '',
      w: sanitizedWallets,
      t: S.t,
      b: S.b,
      n: S.n
    };
    OWVault.saveRegistry(reg);
    localStorage.setItem(OWVault.STORAGE_SESSION, JSON.stringify({ accountId: S.accountId }));
    if (S.sbToken && S.sbUserId && OWVault.isSupabaseConfigured()) {
      OWVault.syncAccountToSupabase(reg[S.accountId], S.sbToken);
    }
  } catch (e) {}
}

/* Initialize demo account & restore active session on boot */
async function bootSession() {
  try {
    const reg = OWVault.loadRegistry();
    if (!reg.demo) {
      const salt = 'a1b2c3d4e5f60718293a4b5c6d7e8f90';
      const pwdHash = await OWVault.hashPassword('demo1234', salt);
      const demoKey = await OWVault.deriveVaultKey('demo1234', salt);
      const def = defaultState();
      const encWallets = [];
      for (const w of def.w) {
        encWallets.push(await OWVault.buildEncryptedWallet(w, demoKey));
      }
      reg.demo = {
        id: 'demo',
        isDemo: true,
        fullName: 'Juan Dela Cruz',
        email: 'demo@onewallet.ph',
        paydayMode: 'bimonthly',
        customPayday: '',
        salt,
        pwdHash,
        w: encWallets,
        t: def.t,
        b: def.b,
        n: 20
      };
      OWVault.saveRegistry(reg);
    }

    const active = JSON.parse(localStorage.getItem(OWVault.STORAGE_SESSION) || 'null');
    const targetId = (active && reg[active.accountId]) ? active.accountId : 'demo';
    const acc = reg[targetId];
    if (acc) {
      if (targetId === 'demo') {
        sessionVaultKey = await OWVault.deriveVaultKey('demo1234', acc.salt);
      }
      const hydratedW = await OWVault.hydrateWalletsInMemory(acc.w, sessionVaultKey, acc.fullName);
      S = {
        ...S,
        accountId: acc.id,
        fullName: acc.fullName,
        email: acc.email,
        paydayMode: acc.paydayMode || 'bimonthly',
        customPayday: acc.customPayday || '',
        salt: acc.salt,
        w: hydratedW,
        t: acc.t || [],
        b: acc.b || [],
        n: acc.n || 20
      };
    }
  } catch (e) {}
}

const total = () => S.w.reduce((s, w) => s + Number(w.b || 0), 0);
const reserved = () => S.b.reduce((s, b) => s + Number(b.a || 0), 0);
const daysLeft = () => {
  const [y1, m1, d1] = getToday().split('-').map(Number);
  const [y2, m2, d2] = getPayday().split('-').map(Number);
  const diff = Math.round((new Date(y2, m2 - 1, d2) - new Date(y1, m1 - 1, d1)) / 864e5);
  return Math.max(1, diff);
};
const free = () => Math.max(0, total() - reserved());
const perDay = () => free() / daysLeft();

async function handleSignIn() {
  if (S.authBusy) return;
  const email = val('login-email').toLowerCase();
  const pwd = val('login-pwd');
  if (!email || !pwd) return fail({ 'login-email': !email ? 'Enter your email.' : '', 'login-pwd': !pwd ? 'Enter your password.' : '' }, ['login-email', 'login-pwd']);

  S.authBusy = true;
  S.draft = { ...S.draft, 'login-email': email, 'login-pwd': pwd };
  R();

  try {
    // 1. If Supabase Cloud is configured, try authenticating with Supabase Auth first
    if (OWVault.isSupabaseConfigured()) {
      try {
        const authData = await OWVault.sbFetch('/auth/v1/token?grant_type=password', {
          method: 'POST',
          body: { email, password: pwd }
        });
        if (authData && authData.access_token && authData.user) {
          const uid = authData.user.id;
          const token = authData.access_token;
          const cloudAcc = await OWVault.pullAccountFromSupabase(uid, token);
          const salt = cloudAcc?.salt || OWVault.randomSaltHex(16);
          sessionVaultKey = await OWVault.deriveVaultKey(pwd, salt);
          const hydratedW = cloudAcc ? await OWVault.hydrateWalletsInMemory(cloudAcc.w, sessionVaultKey, cloudAcc.fullName) : [];
          S = {
            ...defaultState(),
            view: 'today',
            accountId: email,
            fullName: cloudAcc?.fullName || authData.user.user_metadata?.full_name || email.split('@')[0],
            email,
            paydayMode: cloudAcc?.paydayMode || 'bimonthly',
            customPayday: cloudAcc?.customPayday || '',
            salt,
            sbToken: token,
            sbUserId: uid,
            cloudStatus: 'Connected to Supabase Cloud',
            w: hydratedW,
            t: cloudAcc?.t || [],
            b: cloudAcc?.b || [],
            n: cloudAcc?.n || 20
          };
          persistActiveAccount();
          location.replace('#today');
          return;
        }
      } catch (cloudErr) {
        // Fall through to local registry if account exists locally, otherwise surface error
        const reg = OWVault.loadRegistry();
        const localMatch = Object.values(reg).find(a => a.email.toLowerCase() === email);
        if (!localMatch) {
          return fail({ 'login-pwd': `Supabase Auth: ${cloudErr.message}` }, ['login-email', 'login-pwd']);
        }
      }
    }

    // 2. Local Multi-Account Registry Verification (PBKDF2-SHA256)
    const reg = OWVault.loadRegistry();
    const acc = Object.values(reg).find(a => a.email.toLowerCase() === email);
    if (!acc) {
      return fail({ 'login-email': 'No account found with this email. Switch to Create account to register.' }, ['login-email', 'login-pwd']);
    }
    const computedHash = await OWVault.hashPassword(pwd, acc.salt);
    if (acc.pwdHash && computedHash !== acc.pwdHash) {
      return fail({ 'login-pwd': 'Incorrect password for this account.' }, ['login-email', 'login-pwd']);
    }
    sessionVaultKey = await OWVault.deriveVaultKey(pwd, acc.salt);
    const hydratedW = await OWVault.hydrateWalletsInMemory(acc.w, sessionVaultKey, acc.fullName);
    S = {
      ...defaultState(),
      view: 'today',
      accountId: acc.id,
      fullName: acc.fullName,
      email: acc.email,
      paydayMode: acc.paydayMode || 'bimonthly',
      customPayday: acc.customPayday || '',
      salt: acc.salt,
      w: hydratedW,
      t: acc.t || [],
      b: acc.b || [],
      n: acc.n || 20
    };
    localStorage.setItem(OWVault.STORAGE_SESSION, JSON.stringify({ accountId: acc.id }));
    location.replace('#today');
  } finally {
    S.authBusy = false;
  }
}

async function handleSignUp() {
  if (S.authBusy) return;
  const fullName = val('reg-name');
  const email = val('reg-email').toLowerCase();
  const pwd = val('reg-pwd');
  const paydayMode = val('reg-payday') || 'bimonthly';
  const preset = val('reg-preset') || 'starter';
  const e = {};
  if (!fullName) e['reg-name'] = 'Enter your name.';
  if (!email || !email.includes('@')) e['reg-email'] = 'Enter a valid email address.';
  if (!pwd || pwd.length < 6) e['reg-pwd'] = 'Use at least 6 characters for your vault key.';
  if (Object.keys(e).length) return fail(e, ['reg-name', 'reg-email', 'reg-pwd', 'reg-payday', 'reg-preset']);

  const reg = OWVault.loadRegistry();
  if (Object.values(reg).some(a => a.email.toLowerCase() === email)) {
    return fail({ 'reg-email': 'An account with this email already exists. Sign in instead.' }, ['reg-name', 'reg-email', 'reg-pwd', 'reg-payday', 'reg-preset']);
  }

  S.authBusy = true;
  S.draft = { ...S.draft, 'reg-name': fullName, 'reg-email': email, 'reg-pwd': pwd, 'reg-payday': paydayMode, 'reg-preset': preset };
  R();

  try {
    const salt = OWVault.randomSaltHex(16);
    const pwdHash = await OWVault.hashPassword(pwd, salt);
    sessionVaultKey = await OWVault.deriveVaultKey(pwd, salt);
    const starter = await OWVault.createStarterWorkspace({ preset, fullName, cryptoKey: sessionVaultKey });
    const hydratedW = await OWVault.hydrateWalletsInMemory(starter.w, sessionVaultKey, fullName);

    let sbToken = '', sbUserId = '', cloudSynced = false;
    if (OWVault.isSupabaseConfigured()) {
      try {
        const signUpRes = await OWVault.sbFetch('/auth/v1/signup', {
          method: 'POST',
          body: { email, password: pwd, data: { full_name: fullName } }
        });
        sbUserId = signUpRes?.user?.id || signUpRes?.id || '';
        sbToken = signUpRes?.access_token || '';
        if (!sbToken && sbUserId) {
          const tokenRes = await OWVault.sbFetch('/auth/v1/token?grant_type=password', {
            method: 'POST',
            body: { email, password: pwd }
          });
          sbToken = tokenRes?.access_token || '';
        }
        cloudSynced = Boolean(sbUserId && sbToken);
      } catch (err) {
        if (/already registered|already exists/i.test(err.message)) {
          return fail({ 'reg-email': `Supabase Sign-Up: ${err.message}` }, ['reg-name', 'reg-email', 'reg-pwd', 'reg-payday', 'reg-preset']);
        }
      }
    }

    const id = 'acc_' + Date.now();
    reg[id] = {
      id,
      fullName,
      email,
      paydayMode,
      customPayday: '',
      salt,
      pwdHash,
      sbUserId,
      cloudSynced,
      w: starter.w,
      t: starter.t,
      b: starter.b,
      n: starter.n
    };
    OWVault.saveRegistry(reg);
    if (sbToken && sbUserId) {
      await OWVault.syncAccountToSupabase(reg[id], sbToken, true);
    }

    S = {
      ...defaultState(),
      view: 'today',
      accountId: id,
      fullName,
      email,
      paydayMode,
      customPayday: '',
      salt,
      sbToken,
      sbUserId,
      w: hydratedW,
      t: starter.t,
      b: starter.b,
      n: starter.n
    };
    persistActiveAccount();
    location.replace('#today');
  } finally {
    S.authBusy = false;
  }
}

  S.draft = { 'login-email': email, 'login-pwd': email === 'demo@onewallet.ph' ? 'demo1234' : '' };
  S.errors = {};
  R();
  document.getElementById('login-pwd')?.focus();
}

function signOut() {
  S.modal = '';
  S.revealed = {};
  sessionVaultKey = null;
  location.replace('#login');
}

function openModal(m, id = 0) {
  if (!S.modal && document.activeElement && document.activeElement !== document.body) {
    lastModalTrigger = document.activeElement;
  }
  S.modal = m; S.editWid = 0; S.editTxId = 0; S.editBillId = 0; S.payBillId = 0; S.draft = {}; S.errors = {};
  if (m === 'wallet' && id) {
    S.editWid = id;
    const w = S.w.find(x => x.id == id);
    if (w) S.draft = { wnm: w.n, wb: String(w.b), wstyle: w.style, wnum: w.num, wexp: w.exp, wcvv: w.cvv, wholder: w.holder };
  } else if (m === 'wallet') {
    S.draft = { wstyle: 'bdo-gold', wexp: '08/29', wholder: (S.fullName || 'JUAN DELA CRUZ').toUpperCase() };
  } else if (m === 'tx' && id) {
    S.editTxId = id;
    const t = S.t.find(x => x.id == id);
    if (t) S.draft = { ty: t.a >= 0 ? '1' : '-1', am: String(Math.abs(t.a)), mw: String(t.w), mc: t.c, nt: t.s, td: `${getToday().slice(0, 4)}-${t.d}` };
  } else if (m === 'tx') {
    S.draft = { td: getToday(), mw: String(S.wid || S.w[0]?.id || 1) };
  } else if (m === 'bill' && id) {
    S.editBillId = id;
    const b = S.b.find(x => x.id == id);
    if (b) S.draft = { bn: b.n, ba: String(b.a), bd: b.d };
  } else if (m === 'payBill' && id) {
    S.payBillId = id;
    const b = S.b.find(x => x.id == id);
    if (b) S.draft = { pw: String(S.w[0]?.id || 1), pa: String(b.a) };
  } else if (m === 'payday') {
    S.draft = { pmode: S.paydayMode || 'bimonthly', pcustom: S.customPayday || OWVault.shiftDaysISO(getToday(), 15), pname: S.fullName };
  } else if (m === 'supabase') {
    const cfg = OWVault.getSupabaseConfig();
    S.draft = { sburl: cfg.url, sbkey: cfg.anonKey };
  }
  renderModal();
}
function closeModal(mutated = false) {
  const trigger = lastModalTrigger;
  lastModalTrigger = null;
  S.modal = ''; S.editWid = 0; S.editTxId = 0; S.editBillId = 0; S.payBillId = 0; S.draft = {}; S.errors = {};
  if (mutated) R();
  else renderModal();
  if (trigger && trigger.isConnected) trigger.focus();
}
let keepWallet = false;
function openWallet(id) { S.wid = id; if (S.view !== 'wallets') { keepWallet = true; go('wallets'); } else R(); }

function toggleReveal(id) {
  S.revealed[id] = !S.revealed[id];
  R();
}
function toggleFlip(id) {
  S.flipped[id] = !S.flipped[id];
  R();
}
function spinCard(delta) {
  if (!S.w.length) return;
  S.carouselIdx = ((S.carouselIdx || 0) + delta + S.w.length) % S.w.length;
  R();
}
function goCard(idx) {
  if (!S.w.length) return;
  S.carouselIdx = Math.max(0, Math.min(S.w.length - 1, idx));
  R();
}
function setWalletView(mode) {
  S.walletView = mode === 'grid' ? 'grid' : 'carousel';
  R();
}
let cDrag = { active: false, pointerId: null, startX: 0, dx: 0, moved: false };
function carouselDown(e) {
  if (e.button !== 0 && e.pointerType === 'mouse') return;
  if (e.target.closest('button, a')) return;
  cDrag = { active: true, pointerId: e.pointerId, startX: e.clientX, dx: 0, moved: false };
  try { e.currentTarget.setPointerCapture(e.pointerId); } catch (_) {}
}
function carouselMove(e) {
  if (!cDrag.active || e.pointerId !== cDrag.pointerId) return;
  cDrag.dx = e.clientX - cDrag.startX;
  if (Math.abs(cDrag.dx) > 8) cDrag.moved = true;
}
function carouselUp(e) {
  if (!cDrag.active || e.pointerId !== cDrag.pointerId) return;
  const dx = cDrag.dx;
  const moved = cDrag.moved;
  carouselCancel(e);
  if (moved && Math.abs(dx) > 42) {
    spinCard(dx < 0 ? 1 : -1);
  }
}
function carouselCancel(e) {
  if (cDrag.pointerId !== null && e?.currentTarget) {
    try { e.currentTarget.releasePointerCapture(cDrag.pointerId); } catch (_) {}
  }
  cDrag = { active: false, pointerId: null, startX: 0, dx: 0, moved: false };
}
function maskAllCards() {
  S.revealed = {};
  S.flipped = {};
  R();
}
function copyCardNum(id) {
  const w = S.w.find(x => x.id == id);
  if (!w) return;
  try { navigator.clipboard?.writeText(cleanDigits(w.num)); } catch (e) {}
  S.copiedId = id;
  R();
  setTimeout(() => { if (S.copiedId === id) { S.copiedId = 0; R(); } }, 1800);
}
function pickCardStyle(styleId) {
  const st = getCardStyle(styleId);
  const curName = document.getElementById('wnm')?.value ?? S.draft.wnm ?? '';
  const isPresetName = !curName || CARD_STYLES.some(x => x.bank.toLowerCase() === curName.toLowerCase() || `${x.bank} ${x.tier}`.toLowerCase() === curName.toLowerCase());
  S.draft = {
    ...S.draft,
    wnm: isPresetName ? `${st.bank}${st.tier && !/Mastercard|Debit|Passbook/i.test(st.tier) ? ' ' + st.tier : ''}` : curName,
    wb: document.getElementById('wb')?.value ?? S.draft.wb ?? '',
    wnum: document.getElementById('wnum')?.value ?? S.draft.wnum ?? '',
    wexp: document.getElementById('wexp')?.value ?? S.draft.wexp ?? '08/29',
    wcvv: document.getElementById('wcvv')?.value ?? S.draft.wcvv ?? '',
    wholder: document.getElementById('wholder')?.value ?? S.draft.wholder ?? (S.fullName || 'JUAN DELA CRUZ').toUpperCase(),
    wstyle: styleId
  };
  renderModal();
}

/* ---------- Mutations ---------- */
function addTx(w, a, s, c, md = getToday().slice(5)) {
  S.t.unshift({ id: ++S.n, d: md, s, c, w: +w, a });
  const wl = S.w.find(z => z.id == w);
  if (wl) wl.b = Math.round((wl.b + a) * 100) / 100;
}
function delTx(id) {
  const t = S.t.find(x => x.id == id);
  if (!t) return;
  const wl = S.w.find(z => z.id == t.w);
  if (wl) wl.b = Math.round((wl.b - t.a) * 100) / 100;
  S.t = S.t.filter(x => x.id != id);
  R();
}
function delBill(id) { S.b = S.b.filter(x => x.id != id); R(); }
function delWallet(id) {
  S.w = S.w.filter(x => x.id != id);
  S.t = S.t.filter(t => t.w != id);
  if (S.wid == id) S.wid = 0;
  closeModal(true);
}

function fail(errors, fields) {
  S.authBusy = false;
  S.errors = errors;
  S.draft = { ...S.draft, ...Object.fromEntries(fields.map(f => [f, val(f)])) };
  if (S.modal) renderModal();
  else {
    R();
    document.querySelector('[aria-invalid="true"]')?.focus();
  }
}

function saveTx() {
  const a = parseFloat(val('am'));
  if (!(a > 0)) return fail({ am: 'Enter an amount greater than ₱0.' }, ['ty', 'am', 'mw', 'mc', 'nt', 'td']);
  if (!S.w.length) return fail({ mw: 'Add a wallet first before recording an entry.' }, ['ty', 'am', 'mw', 'mc', 'nt', 'td']);
  const signedAmt = +val('ty') * a;
  const label = val('nt') || (val('ty') === '1' ? 'Income' : 'Expense');
  const cat = val('mc') || 'Others';
  const rawDate = val('td') || getToday();
  const md = rawDate.length >= 5 ? rawDate.slice(-5) : getToday().slice(5);

  if (S.editTxId) {
    const old = S.t.find(x => x.id == S.editTxId);
    if (old) {
      const oldWl = S.w.find(z => z.id == old.w);
      if (oldWl) oldWl.b = Math.round((oldWl.b - old.a) * 100) / 100;
      Object.assign(old, { w: +val('mw'), a: signedAmt, s: label, c: cat, d: md });
      const newWl = S.w.find(z => z.id == old.w);
      if (newWl) newWl.b = Math.round((newWl.b + signedAmt) * 100) / 100;
    }
  } else {
    addTx(val('mw'), signedAmt, label, cat, md);
  }
  closeModal(true);
}

async function saveWallet() {
  const n = val('wnm'), b = val('wb') === '' ? 0 : parseFloat(val('wb'));
  const style = S.draft.wstyle || 'bdo-gold';
  const rawDigits = cleanDigits(val('wnum'));
  const num = rawDigits.length >= 4 ? rawDigits.padStart(16, '453289102341') : ('453289102341' + String(1000 + Math.floor(Math.random() * 8999)));
  const exp = val('wexp') || '08/29';
  const cvv = (val('wcvv').replace(/\D/g, '').slice(0, 4)) || '418';
  const holder = (val('wholder') || S.fullName || 'JUAN DELA CRUZ').toUpperCase();
  const e = {};
  if (!n) e.wnm = 'Give this wallet or card a name.';
  if (isNaN(b)) e.wb = 'Enter a number, or leave it blank for ₱0.';
  if (Object.keys(e).length) return fail(e, ['wnm', 'wb', 'wnum', 'wexp', 'wcvv', 'wholder']);

  if (!sessionVaultKey) {
    sessionVaultKey = await OWVault.deriveVaultKey('demo1234', S.salt || 'a1b2c3d4e5f60718293a4b5c6d7e8f90');
  }
  const encMeta = await OWVault.buildEncryptedWallet({ id: S.editWid || ++S.n, n, b, style, num, exp, cvv, holder }, sessionVaultKey);

  if (S.editWid) {
    const existing = S.w.find(x => x.id == S.editWid);
    if (existing) Object.assign(existing, { ...encMeta, num, exp, cvv, holder });
  } else {
    S.w.push({ ...encMeta, num, exp, cvv, holder });
  }
  closeModal(true);
}

function saveBill() {
  const n = val('bn'), a = parseFloat(val('ba')), d = val('bd');
  const e = {};
  if (!n) e.bn = 'Name the bill.';
  if (!(a > 0)) e.ba = 'Enter an amount greater than ₱0.';
  if (Object.keys(e).length) return fail(e, ['bn', 'ba', 'bd']);
  if (S.editBillId) {
    const existing = S.b.find(x => x.id == S.editBillId);
    if (existing) Object.assign(existing, { n, a, d: d || 'Before payday' });
  } else {
    S.b.push({ id: ++S.n, n, a, d: d || 'Before payday' });
  }
  closeModal(true);
}

function confirmPayBill() {
  const bill = S.b.find(x => x.id == S.payBillId);
  if (!bill) return closeModal();
  const wid = +val('pw');
  const amt = parseFloat(val('pa'));
  if (!(amt > 0)) return fail({ pa: 'Enter a valid payment amount.' }, ['pw', 'pa']);
  addTx(wid, -amt, `${bill.n} (Bill paid)`, 'Bills', getToday().slice(5));
  S.b = S.b.filter(x => x.id != bill.id);
  closeModal(true);
}

function savePaydaySettings() {
  const fullName = val('pname') || S.fullName;
  const mode = val('pmode') || 'bimonthly';
  const custom = val('pcustom') || '';
  if (mode === 'custom' && (!custom || custom <= getToday())) {
    return fail({ pcustom: 'Pick a future payday date after today.' }, ['pname', 'pmode', 'pcustom']);
  }
  S.fullName = fullName;
  S.paydayMode = mode;
  S.customPayday = custom;
  closeModal(true);
}

function saveSupabaseSettings() {
  const url = val('sburl');
  const key = val('sbkey');
  OWVault.setSupabaseConfig(url, key);
  if (url && key && S.sbToken && S.sbUserId) {
    persistActiveAccount();
  }
  closeModal(true);
}

function saveReconcile() {
  const w = S.w.find(x => x.id == S.wid), real = parseFloat(val('rb'));
  if (isNaN(real)) return fail({ rb: 'Enter the balance your app shows.' }, ['rb']);
  const diff = Math.round((real - w.b) * 100) / 100;
  if (diff) addTx(w.id, diff, 'Balance correction', 'Others');
  closeModal(true);
}

async function resetData() {
  localStorage.removeItem('onewallet_accounts_v2');
  localStorage.removeItem('onewallet_active_session_v2');
  S = defaultState();
  await bootSession();
  closeModal(true);
  go('today');
}

/* ---------- Alert import ---------- */
const SAMPLES = [
  'GCash: You have paid ₱189.00 to Jollibee. Ref 5012 884 991.',
  'Maya: You received ₱1,500.00 from Juan Dela Cruz.',
  'GoTyme: You sent ₱350.00 to Grab. Ref 88231.'
];
function fillSample(i) { S.raw = SAMPLES[i]; S.pr = null; R(); document.getElementById('raw')?.focus(); }
function readAlert() {
  const x = S.raw = val('raw');
  if (!x) { S.pr = { err: 'Paste an alert first, or try one of the samples.' }; return R(); }
  const amt = (x.match(/(?:₱|PHP\s?)\s?([\d,]+(?:\.\d+)?)/i) || [])[1];
  if (!amt) { S.pr = { err: 'We couldn’t find a peso amount. Alerts usually look like “paid ₱189.00 to …”.' }; return R(); }
  const isIn = /received|credited|cash[- ]?in|deposit/i.test(x), isOut = /paid|sent|transferred|purchase|debited|cash[- ]?out/i.test(x);
  const s = (x.match(/(?:to|from|at)\s+([A-Z][\w&' -]*?)(?:\.|,|\s+Ref|$)/) || [])[1] || 'Unknown';
  const w = S.w.find(z => new RegExp(z.n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i').test(x));
  const c = isIn && !isOut ? 'Income' : /jollibee|mcdo|food|coffee|milk ?tea/i.test(x) ? 'Food' : /grab|angkas|jeep|mrt|lrt/i.test(x) ? 'Transport' : /load|globe|smart/i.test(x) ? 'Load' : /meralco|wi-?fi|water|converge/i.test(x) ? 'Bills' : 'Others';
  S.pr = { a: parseFloat(amt.replace(/,/g, '')), dir: isIn && !isOut ? 1 : -1, s, c, w: w ? w.id : S.w[0]?.id };
  R();
}
function confirmAlert() { const p = S.pr; addTx(val('pw'), p.a * p.dir, p.s, p.c); S.pr = null; S.raw = ''; go('ledger'); }

};
const inputAttrs = id => `id="${id}" name="${id}" class="${C.input}" ${S.errors[id] ? `aria-invalid="true" aria-describedby="${id}-err"` : ''}`;
const draft = (id, fallback = '') => esc(S.draft[id] ?? fallback);
const walletOptions = sel => S.w.map(w => `<option value="${w.id}" ${w.id == sel ? 'selected' : ''}>${esc(w.n)} (${peso(w.b)})</option>`).join('');

/* Tactile Bank & E-Wallet Card Face Renderer (True ISO/IEC 7810 ID-1 1.586:1 Proportions) */

function ledgerList(list, { deletable = false, limit = Infinity, empty = 'No entries yet.' } = {}) {
  const rows = list.slice(0, limit);
  if (!rows.length) return `<p class="py-8 text-center ${C.meta}">${empty}</p>`;
  const groups = [];
  rows.forEach(t => { const g = groups.at(-1); if (g && g.d === t.d) g.items.push(t); else groups.push({ d: t.d, items: [t] }); });
  return groups.map(g => `<section class="mt-4 first:mt-1.5">
    <h3 class="text-xs font-semibold text-ink-2 pb-1">${dayLabel(g.d)}</h3>
    <ul>${g.items.map(t => txRow(t, deletable)).join('')}</ul>
  </section>`).join('');
}

              const isCenter = diff === 0;

              if (diff === -1) { tx = '-58%'; sc = 0.84; ry = 22; op = 0.82; zi = 20; }

              <span class="tnum text-[24px] font-semibold text-ink">${peso(activeW.b)}</span>

                <button type="button" class="${C.btn2}" onclick="toggleFlip(${activeW.id})">${activeFlp ? 'Show front' : 'Spin card 180°'}</button>
                <button type="button" class="${C.btn2}" onclick="toggleReveal(${activeW.id})">${icon(activeRev ? I.eyeOff : I.eye, 'w-4 h-4', 16)}${activeRev ? 'Hide info' : 'Check card info'}</button>
                <button type="button" class="${C.link} text-sm" onclick="openModal('wallet', ${activeW.id})">Card style</button>
              </div>
              <button type="button" class="${C.btn}" onclick="openWallet(${activeW.id})">Open ledger${icon(I.chevron, 'w-4 h-4', 16)}</button>

        <div class="grid gap-4 md:grid-cols-2 items-stretch">
          ${S.w.map(cw => {

            const flp = !!S.flipped[cw.id];

              <div class="px-1.5 flex flex-col gap-2.5">

      <ul class="divide-y divide-line">

    const out = Object.values(byCat).reduce((s, v) => s + v, 0);
    const max = Math.max(1, ...Object.values(byCat));
    const bar = (pct, cls = 'bg-ink') => `<span class="block h-1.5 rounded-full bg-track overflow-hidden"><span class="block h-full rounded-full ${cls}" style="width:${pct}%"></span></span>`;
    return `

      <div class="grid gap-4 lg:grid-cols-2 items-start">
        <section class="${C.card} p-5">
          ${cardHead('Money in vs out')}

            <div><div class="flex justify-between mb-1.5"><span class="text-ink-2">Money in</span><span class="font-semibold text-gain">${peso(inc)}</span></div>${bar(inc ? 100 : 0, 'bg-gain')}</div>
            <div><div class="flex justify-between mb-1.5"><span class="text-ink-2">Money out</span><span class="font-semibold text-ink">${peso(out)}</span></div>${bar(inc ? Math.min(100, out / inc * 100) : out ? 100 : 0)}</div>
          </div>
          <p class="${C.meta} pt-3 mt-4 border-t border-line">${inc ? `You’ve spent ${Math.round(out / inc * 100)}% of recorded income this period.` : 'No income recorded yet.'}</p>

          </ul>
          <p class="${C.meta} pt-3 mt-4 border-t border-line">Total categorized outflow: <span class="tnum font-semibold text-ink">${peso(out)}</span></p>

            </div>
            <div class="flex gap-2">
              <button type="button" class="${C.btn2}" onclick="S.authTab='signup';signOut()">Create new account</button>
              <button type="button" class="${C.btn}" onclick="signOut()">Switch / Sign out</button>
            </div>
          </div>

          <div class="flex flex-wrap items-center justify-between gap-3 p-5">
            <div>
              <p class="text-sm font-semibold text-ink">Reset demo data</p>
              <p class="${C.meta}">Restore original sample wallets, entries and bills.</p>
            </div>
            <button type="button" class="${C.btn2} !border-alert/50 !text-alert hover:!bg-alert/5" onclick="openModal('reset')">Reset…</button>
          </div>
        </section>
      </div>`;
  },

  help: () => `
    ${pageHead('Help', 'How One Wallet & Zero-Knowledge Card Encryption work')}
    <div class="grid gap-4 lg:grid-cols-2 items-start">
      <section class="${C.card} p-5">
        ${cardHead('How the daily amount works')}
        <ol class="mt-2 space-y-2.5 text-sm text-ink-2 list-decimal pl-5">
          <li>Add each wallet or card with the balance its app shows right now.</li>
          <li>Set aside bills due before your next payday (and click <strong>Pay bill</strong> when you settle them).</li>
          <li>What’s left, divided by the real days until your configured payday, is your safe amount per day.</li>
        </ol>
      </section>
      <section class="${C.card} p-5">
        ${cardHead('Security & architecture')}
        <dl class="mt-2 space-y-3 text-sm">
          <div><dt class="font-semibold text-ink">Are my card numbers readable in the database?</dt><dd class="text-ink-2">No. Card numbers, expiry dates and CVV codes are encrypted in your browser using Web Crypto <code>AES-256-GCM</code> derived from your password via <code>PBKDF2-SHA256</code> before saving to Supabase or local storage.</dd></div>
          <div><dt class="font-semibold text-ink">Can other users see my wallets or entries?</dt><dd class="text-ink-2">No. Each account is isolated by Row-Level Security (<code>auth.uid() = user_id</code>) in Supabase PostgreSQL and keyed separately per user.</dd></div>
          <div><dt class="font-semibold text-ink">A balance looks wrong.</dt><dd class="text-ink-2">Open the wallet and choose Correct balance. We add an entry for the difference so your history stays traceable.</dd></div>
        </dl>
      </section>
    </div>`,

  more: () => `
    ${pageHead('More', 'All workspace sections')}
    <section class="${C.card}">
      <ul class="divide-y divide-line">
        ${[['wallets', 'Wallets & Cards'], ['insights', 'Insights'], ['settings', 'Settings & Accounts'], ['help', 'Help']].map(([k, l]) => `<li><a href="#${k}" class="flex items-center justify-between px-5 py-3.5 text-sm font-medium hover:bg-subtle/60">${l}<span class="text-mute">${icon(I.chevron, 'w-4 h-4', 16)}</span></a></li>`).join('')}
      </ul>
    </section>`
};

/* ---------- Shell & render ---------- */
const NAV = [
  ['today', 'Today', I.today],
  ['wallets', 'Wallets & Cards', I.wallets],
  ['ledger', 'Ledger', I.ledger],
  ['import', 'Import alert', I.import],
  ['bills', 'Bills due', I.bills],
  ['insights', 'Insights', I.insights]
];
const NAV2 = [
  ['settings', 'Settings', I.settings],
  ['help', 'Help', I.help]
];
const TABS = [['today', 'Today', I.today], ['ledger', 'Ledger', I.ledger], ['import', 'Import', I.import], ['bills', 'Bills', I.bills], ['more', 'More', I.menu]];
const MORE_GROUP = ['more', 'wallets', 'insights', 'settings', 'help'];

const navLink = ([k, l, ic]) => {
  const on = S.view === k;
  const count = k === 'bills' && S.b.length ? S.b.length : 0;
  return `<a href="#${k}" ${on ? 'aria-current="page"' : ''} class="relative flex items-center gap-2.5 h-9 mx-3 px-3 rounded-ctl text-sm ${on ? 'bg-card font-semibold text-ink border border-line' : 'text-ink-2 hover:text-ink hover:bg-card/60'}">
    ${icon(ic, 'w-4 h-4', 16)}
    <span class="truncate">${l}</span>
    ${count ? `<span class="ml-auto tnum text-xs font-medium px-1.5 py-0.5 rounded-full ${on ? 'bg-subtle text-ink' : 'bg-card text-ink-2 border border-line'}">${count}</span>` : on ? '<span class="ml-auto w-2 h-3 rounded-l-full bg-ink" aria-hidden="true"></span>' : ''}
  </a>`;
};

function renderModal() {
  const modalRoot = document.getElementById('modal-root');
  if (!modalRoot) return;
  modalRoot.innerHTML = S.modal ? `
    <div class="fixed inset-0 z-50 bg-ink/40 flex items-end sm:items-center justify-center sm:p-4" onclick="if(event.target===this)closeModal()">
      <div role="dialog" aria-modal="true" aria-labelledby="modal-title" class="dialog-in w-full sm:w-[500px] max-h-[90dvh] overflow-y-auto bg-card border border-line rounded-t-card sm:rounded-card p-5 sm:p-6 pb-[max(1.25rem,env(safe-area-inset-bottom))]">
        ${M[S.modal]()}
      </div>
    </div>` : '';
  if (S.modal) {
    const firstErr = modalRoot.querySelector('[aria-invalid="true"]');
    (firstErr || modalRoot.querySelector('[data-autofocus]') || modalRoot.querySelector('[role="dialog"] button'))?.focus();
  }
}

function R() {
  if (S.view !== 'login') persistActiveAccount();
  const shell = document.getElementById('shell-root') || document.getElementById('app');
  if (S.view === 'login') {
    shell.innerHTML = V.login();
    document.title = 'Sign in · One Wallet';
    renderModal();
    return;
  }

  const label = [...NAV, ...NAV2, ['more', 'More']].find(n => n[0] === S.view)?.[1] ?? 'One Wallet';
  document.title = `${label} · One Wallet`;
  const pdShort = shortDate(getPayday().slice(5));
  const dl = daysLeft();

  shell.innerHTML = `
    <div class="min-h-dvh bg-paper md:grid md:grid-cols-[248px_1fr]">
      <aside class="max-md:hidden sticky top-0 h-dvh flex flex-col bg-paper">
        <a href="#today" class="flex items-center px-5 pt-5 pb-4">
          ${brandLockup('Passbook & Card Vault')}
        </a>

        <div class="mx-3 mb-4 p-3 rounded-card bg-card border border-line text-xs">
          <div class="flex items-center justify-between gap-2 pb-2 mb-2 border-b border-line">
            <span class="font-semibold text-ink truncate">${esc(S.fullName)}</span>
            <button type="button" class="text-ink-2 hover:text-ink underline cursor-pointer shrink-0" onclick="signOut()">Switch</button>
          </div>
          <div class="flex items-center justify-between text-mute">
            <span class="inline-flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-gain" aria-hidden="true"></span>Next payday</span>
            <button type="button" class="tnum font-semibold text-ink hover:underline cursor-pointer" onclick="openModal('payday')">${pdShort} (${dl}d)</button>
          </div>
        </div>

        <p class="px-6 pb-1.5 text-xs font-medium text-mute">Passbook</p>
        <nav aria-label="Main" class="flex flex-col gap-0.5">${NAV.map(navLink).join('')}</nav>

        <div class="mt-auto pt-3 pb-4">
          <p class="px-6 pb-1.5 text-xs font-medium text-mute">System</p>
          <nav aria-label="Account" class="flex flex-col gap-0.5">${NAV2.map(navLink).join('')}</nav>
        </div>
      </aside>

      <div class="min-w-0 md:py-3 md:pr-3 flex flex-col">
        <header class="md:hidden flex items-center justify-between px-4 py-3 bg-card border-b border-line">
          <a href="#today" class="flex items-center gap-2">${brandLogo('h-6 w-auto', 24)}<span class="text-sm font-semibold text-ink">One Wallet</span></a>
          <button type="button" class="tnum text-xs font-medium px-2.5 py-1 rounded-full bg-subtle text-ink cursor-pointer" onclick="openModal('payday')">Payday ${pdShort} · ${dl}d</button>
        </header>
        <main id="main" class="flex-1 w-full max-w-[1208px] mx-auto px-4 pt-5 pb-28 md:bg-card md:border md:border-line md:rounded-card md:px-8 md:py-7">${V[S.view]()}</main>
      </div>
    </div>

    <nav aria-label="Main" class="md:hidden fixed inset-x-0 bottom-0 z-30 bg-card border-t border-line grid grid-cols-5 pb-[env(safe-area-inset-bottom)]">
      ${TABS.map(([k, l, ic]) => {
        const on = S.view === k || (k === 'more' && MORE_GROUP.includes(S.view));
        return `<a href="#${k}" ${on ? 'aria-current="page"' : ''} class="flex flex-col items-center justify-center gap-0.5 h-15 text-xs ${on ? 'text-ink font-semibold' : 'text-mute'}">
          <span class="relative">${icon(ic, 'w-5 h-5', 20)}${on ? '<span class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-3.5 h-[2px] rounded-full bg-ink" aria-hidden="true"></span>' : ''}</span>
          <span class="mt-1">${l}</span></a>`;
      }).join('')}
    </nav>`;

  renderModal();
}

/* Keyboard navigation: roving ArrowLeft/ArrowRight on tablists & radiogroups, plus modal focus trap & Escape. */
window.addEventListener('keydown', e => {
  if (!S.modal && ['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) {
    const group = e.target.closest('[role="tablist"], [role="radiogroup"]');
    if (group) {
      const role = group.getAttribute('role') === 'tablist' ? '[role="tab"]' : '[role="radio"]';
      const items = [...group.querySelectorAll(role)];
      const idx = items.indexOf(e.target);
      if (idx !== -1 && items.length > 1) {
        e.preventDefault();
        const nextIdx = e.key === 'Home' ? 0 : e.key === 'End' ? items.length - 1 : (idx + (e.key === 'ArrowRight' ? 1 : -1) + items.length) % items.length;
        items[nextIdx].click();
        const updatedGroup = document.querySelector(`[role="${group.getAttribute('role')}"]`);
        updatedGroup?.querySelectorAll(role)?.[nextIdx]?.focus();
        return;
      }
    }
  }
  if (!S.modal) return;
  if (e.key === 'Escape') { closeModal(); return; }
  if (e.key === 'Enter' && e.target.matches('[role="dialog"] input')) { e.preventDefault(); document.querySelector('[role="dialog"] .flex-wrap.items-center.justify-end button:last-child')?.click(); return; }
  if (e.key !== 'Tab') return;
  const f = [...document.querySelectorAll('[role="dialog"] :is(button,input,select,textarea,a[href])')];
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
  else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
});

/* Old hashes from the previous version keep working. */
const ALIAS = { dash: 'today', wal: 'wallets', tx: 'ledger', imp: 'import', bill: 'bills', ins: 'insights', set: 'settings' };
function route() {
  let v = location.hash.slice(1);
  if (ALIAS[v]) { location.replace('#' + ALIAS[v]); return; }
  if (!V[v]) v = 'login';
  const changed = S.view !== v;
  S.view = v; S.modal = ''; S.pr = changed ? null : S.pr;
  if (changed) { S.revealed = {}; S.flipped = {}; }
  if (changed && !keepWallet) S.wid = 0;
  keepWallet = false;
  R();
  if (changed) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
bootSession().finally(route);
</script>
