<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F6F7F9">
  <meta name="description" content="One Wallet — Achromatic passbook ledger, payday runway calculator, and client-encrypted Philippine bank card vault.">
  <title>One Wallet</title>
  <link rel="icon" type="image/png" href="./assets/favicon.png?v=20261125">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="./dist/output.css?v=20261125" rel="stylesheet">
  <style>
    /* Critical fallback tokens & shell rules so cached/delayed CSS never breaks layout or icon sizing */
    :root {
      --color-paper: #F6F7F9;
      --color-card: #FFFFFF;
      --color-subtle: #F1F3F6;
      --color-line: #E2E6ED;
      --color-track: #E5E9F0;
      --color-ink: #0F172A;
      --color-ink-2: #334155;
      --color-mute: #475569;
      --color-accent: #1D5FBF;
      --color-marigold: #D97706;
      --color-gain: #15803D;
      --color-alert: #B91C1C;
    }
    body { background-color: #F6F7F9; color: #0F172A; font-family: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, sans-serif; margin: 0; }
    svg { display: inline-block; vertical-align: middle; flex-shrink: 0; }
    .tnum { font-variant-numeric: tabular-nums; }
    .card-stage { perspective: 1400px; touch-action: pan-y; }
    .card-stage-box { min-height: 205px; }
    @media (min-width: 640px) { .card-stage-box { min-height: 268px; } }
    @media (min-width: 768px) { .card-stage-box { min-height: 282px; } }
    .card-slot { transform-style: preserve-3d; will-change: transform, opacity; }
    .card-flipper { position: relative; width: 100%; aspect-ratio: 1.586 / 1; transform-style: preserve-3d; transition: transform 480ms cubic-bezier(0.23, 1, 0.32, 1); will-change: transform; border-radius: 13px; }
    .card-flipper.is-tilting:not(.is-flipped) { transition: transform 120ms cubic-bezier(0.23, 1, 0.32, 1); }
    .card-flipper.is-flipped { transform: rotateY(180deg); }
    .card-face-front, .card-face-back { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 13px; overflow: hidden; }
    .card-face-back { transform: rotateY(180deg); }
    .card-sheen { position: absolute; inset: 0; pointer-events: none; border-radius: inherit; opacity: 0; background: rgba(255,255,255,0.045); border-top: 1px solid rgba(255,255,255,0.2); transition: opacity 180ms cubic-bezier(0.23, 1, 0.32, 1); }
    @media (hover: hover) and (pointer: fine) {
      .card-flipper:hover .card-sheen { opacity: 1; }
      .grid-card-stage:hover .card-flipper:not(.is-flipped) { transform: translateY(-2px); }
    }
  </style>
</head>
<body class="bg-paper text-ink font-sans antialiased">
  <div id="app">
    <div id="shell-root"></div>
    <div id="modal-root"></div>
  </div>
  <script src="./src/money.js?v=20261125"></script>
  <script src="./src/domain.js?v=20261125"></script>
  <script src="./src/alert-parser.js?v=20261125"></script>
  <script src="./src/vault-cloud.js?v=20261125"></script>
  <script src="./src/cards.js?v=20261125"></script>
  <script src="./src/app.js?v=20261125"></script>
</body>
</html>
