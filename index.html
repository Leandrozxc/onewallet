<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>One Wallet</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:#F6F8F7;color:#0F172A}
.app{display:flex;min-height:100vh}.sb{width:220px;background:#134E4A;padding:24px 14px;display:flex;flex-direction:column;gap:6px;color:#fff;flex-shrink:0}
.sb b{font-size:18px;margin-bottom:20px;padding-left:8px}.sb a{padding:10px 12px;border-radius:10px;font-size:14px;color:#99F6E4;cursor:pointer}.sb a.a,.sb a:hover{background:#0F766E;color:#fff}
.mn{flex:1;padding:32px;display:flex;flex-direction:column;gap:16px;max-width:1100px}
.h{font-size:26px;font-weight:700}.m{font-size:13px;color:#64748B}.k{font-size:34px;font-weight:700}
.c{background:#fff;border:1px solid #E2E8F0;border-radius:16px;padding:18px}
.d{background:#0F766E;color:#fff;border-radius:16px;padding:20px}.q{background:#134E4A;color:#fff;border-radius:16px;padding:20px}.d .m,.q .m{color:#99F6E4}
button{background:#0F766E;color:#fff;border:0;border-radius:10px;padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer;font-family:inherit}
.o{background:#fff;color:#0F766E;border:1.5px solid #0F766E}.dg{background:#fff;color:#B91C1C;border:1px solid #FCA5A5;padding:6px 10px}
.r{display:flex;justify-content:space-between;align-items:center;padding:11px 0;font-size:14px;gap:12px;border-bottom:1px solid #F1F5F9}
input,select,textarea{width:100%;border:1px solid #CBD5E1;border-radius:10px;padding:11px 12px;font-size:14px;font-family:inherit;margin:4px 0 10px}
.p{display:inline-block;background:#E2E8F0;border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer;margin-right:6px}.on{background:#0F766E;color:#fff}
.ln{height:8px;background:#E2E8F0;border-radius:9px;flex:1}.ln i{display:block;height:8px;background:#F59E0B;border-radius:9px}
.gr{display:flex;gap:16px;flex-wrap:wrap}.gr>*{flex:1;min-width:220px}.hd{display:flex;justify-content:space-between;align-items:center}.row{display:flex;gap:8px;flex-wrap:wrap}
.x{color:#B91C1C}.pos{color:#15803D}
.ov{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:center;justify-content:center}.mo{background:#fff;border-radius:20px;padding:28px;width:440px;max-width:92vw}
.lg{min-height:100vh;display:flex}.lg>*{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 10%}
@media(max-width:800px){.sb{display:none}.lg>:first-child{display:none}}
</style></head><body><div id="app"></div><script>
const TODAY='2026-09-30',PAYDAY='2026-10-15',$=n=>'₱'+Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:2}),
E=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),V=id=>document.getElementById(id).value;
const seed=()=>({view:'login',wid:0,fw:0,modal:'',pr:null,raw:'',n:20,
w:[{id:1,n:'GCash',b:1200},{id:2,n:'Maya',b:2100},{id:3,n:'GoTyme',b:800},{id:4,n:'Cash',b:150}],
t:[{id:1,d:'09-30',s:'Jollibee',c:'Food',w:1,a:-189},{id:2,d:'09-30',s:'Salary',c:'Income',w:2,a:12000},{id:3,d:'09-29',s:'Load',c:'Load',w:1,a:-50},{id:4,d:'09-29',s:'Grab',c:'Transport',w:1,a:-140}],
b:[{id:1,n:'Wi-Fi',a:1299,d:'Oct 5'},{id:2,n:'Spotify',a:200,d:'Oct 9'}]});
let S=seed();
const wn=i=>{const w=S.w.find(x=>x.id==i);return w?E(w.n):'?'},
tot=()=>S.w.reduce((s,w)=>s+w.b,0),res=()=>S.b.reduce((s,b)=>s+b.a,0),
days=()=>Math.round((new Date(PAYDAY)-new Date(TODAY))/864e5),per=()=>Math.max(0,(tot()-res())/days()),
go=v=>{S.view=v;S.wid=0;S.pr=null;R()},op=m=>{S.modal=m;R()},
wopt=s=>S.w.map(w=>`<option value=${w.id} ${w.id==s?'selected':''}>${E(w.n)}</option>`).join(''),
btns=f=>`<div class=row><button class=o onclick="op('')">Cancel</button><button onclick="${f}">Save</button></div>`;
function add(w,a,s,c){S.t.unshift({id:++S.n,d:'09-30',s,c,w:+w,a});S.w.find(z=>z.id==w).b+=a}
function del(id){const t=S.t.find(x=>x.id==id);S.w.find(z=>z.id==t.w).b-=t.a;S.t=S.t.filter(x=>x.id!=id);R()}
function txRows(l,d){return l.map(t=>`<div class=r><span>${t.d}</span><span>${E(t.s)}</span><span class=m>${t.c} · ${wn(t.w)}</span><b class="${t.a<0?'x':'pos'}">${t.a<0?'−':'+'}${$(t.a)}</b>${d?`<button class=dg onclick="del(${t.id})">✕</button>`:''}</div>`).join('')||'<div class=m>Nothing here yet.</div>'}
const SAMPLES=['GCash: You have paid ₱189.00 to Jollibee. Ref 5012 884 991.','Maya: You received ₱1,500.00 from Juan Dela Cruz.','GoTyme: You sent ₱350.00 to Grab. Ref 88231.'];
function fill(i){S.raw=SAMPLES[i];S.pr=null;R()}
function rd(){const x=S.raw=V('raw'),a=(x.match(/(?:₱|PHP\s?)\s?([\d,]+(?:\.\d+)?)/i)||[])[1];
if(!a){S.pr={err:'No amount found. Try a sample alert.'};return R()}
const inn=/received|credited|cash[- ]?in|deposit/i.test(x),out=/paid|sent|transferred|purchase|debited|cash[- ]?out/i.test(x),
s=(x.match(/(?:to|from|at)\s+([A-Z][\w&' -]*?)(?:\.|,|\s+Ref|$)/)||[])[1]||'Unknown',
w=S.w.find(z=>new RegExp(z.n,'i').test(x)),
c=inn&&!out?'Income':/jollibee|mcdo|food|coffee|milk ?tea/i.test(x)?'Food':/grab|angkas|jeep|mrt|lrt/i.test(x)?'Transport':/load|globe|smart/i.test(x)?'Load':/meralco|wifi|water|converge/i.test(x)?'Bills':'Others';
S.pr={a:parseFloat(a.replace(/,/g,'')),dir:inn&&!out?1:-1,s,c,w:w?w.id:S.w[0].id};R()}
function okp(){const p=S.pr;add(V('pw'),p.a*p.dir,p.s,p.c);S.pr=null;S.raw='';go('tx')}
function saveTx(){const a=+V('am');if(!a)return;add(V('mw'),V('ty')*a,V('nt')||'Manual',V('mc'));S.modal='';R()}
function saveW(){S.w.push({id:++S.n,n:V('wnm')||'Wallet',b:+V('wb')||0});S.modal='';R()}
function saveB(){S.b.push({id:++S.n,n:V('bn')||'Bill',a:+V('ba')||0,d:V('bd')||'-'});S.modal='';R()}
function doRec(){const w=S.w.find(x=>x.id==S.wid),d=+V('rb')-w.b;if(d)add(w.id,d,'Reconciliation adjustment','Others');S.modal='';R()}
const M={
tx:()=>`<div class=h>Add transaction</div><select id=ty><option value=-1>Expense</option><option value=1>Income</option></select><input id=am type=number placeholder="Amount"><select id=mw>${wopt()}</select><select id=mc>${['Food','Transport','Load','Bills','Others','Income'].map(c=>`<option>${c}</option>`).join('')}</select><input id=nt placeholder="Note or merchant">${btns('saveTx()')}`,
wal:()=>`<div class=h>Add wallet</div><input id=wnm placeholder="Name (e.g. MariBank)"><input id=wb type=number placeholder="Starting balance">${btns('saveW()')}`,
bill:()=>`<div class=h>Add bill</div><input id=bn placeholder="Name"><input id=ba type=number placeholder="Amount"><input id=bd placeholder="Due date (e.g. Oct 12)">${btns('saveB()')}`,
rec:()=>{const w=S.w.find(x=>x.id==S.wid);return `<div class=h>Reconcile ${E(w.n)}</div><div class=m>One Wallet says ${$(w.b)}. Enter what the real app shows.</div><input id=rb type=number placeholder="Real balance">${btns('doRec()')}`}};
const VW={
login:()=>`<div class=lg><div style="background:#0F766E;color:#fff"><div class=k style="font-size:44px">One Wallet</div><div>All your money. One view.</div></div><div><div class=h>Sign in</div><input placeholder=Email><input type=password placeholder=Password><button onclick="go('dash')">Sign in</button><div class=m style="margin-top:12px">Demo: any input works.</div></div></div>`,
dash:()=>`<div class=hd><div class=h>Dashboard</div><button onclick="op('tx')">+ Add transaction</button></div>
<div class=gr><div class=d><div class=m>Total balance</div><div class=k>${$(tot())}</div><div class=m>across ${S.w.length} wallets</div></div><div class=q><div class=m>Runway until Oct 15</div><div class=k>${$(per())} /day</div><div class=m>${days()} days left · bills reserved ${$(res())}</div></div></div>
<div class=gr><div class=c style="flex:2"><b>Recent transactions</b>${txRows(S.t.slice(0,5))}</div><div class=c><b>Wallets</b>${S.w.map(w=>`<div class=r><span>${E(w.n)}</span><b>${$(w.b)}</b></div>`).join('')}</div></div>`,
wal:()=>{const w=S.w.find(x=>x.id==S.wid);return w?`<div class=m style="cursor:pointer" onclick="S.wid=0;R()">‹ Wallets</div><div class=hd><div class=h>${E(w.n)}</div><button onclick="op('rec')">Reconcile balance</button></div><div class=d><div class=m>Balance</div><div class=k>${$(w.b)}</div></div><div class=c><b>Transactions</b>${txRows(S.t.filter(t=>t.w==w.id))}</div>`:`<div class=hd><div class=h>Wallets</div><button onclick="op('wal')">+ Add wallet</button></div><div class=gr>${S.w.map(w=>`<div class=c style="cursor:pointer" onclick="S.wid=${w.id};R()"><b>${E(w.n)}</b><div class=k>${$(w.b)}</div></div>`).join('')}</div>`},
tx:()=>`<div class=hd><div class=h>Transactions</div><button onclick="op('tx')">+ Add</button></div><div><span class="p ${S.fw==0?'on':''}" onclick="S.fw=0;R()">All</span>${S.w.map(w=>`<span class="p ${S.fw==w.id?'on':''}" onclick="S.fw=${w.id};R()">${E(w.n)}</span>`).join('')}</div><div class=c>${txRows(S.t.filter(t=>!S.fw||t.w==S.fw),1)}</div>`,
imp:()=>{const p=S.pr;return `<div class=h>Import alerts</div><div class=m>Paste a payment alert. One Wallet reads the amount, direction and merchant.</div><div class=c><textarea id=raw rows=4 placeholder="Paste alert text">${E(S.raw)}</textarea><div class=row><button onclick="rd()">Read alert</button><button class=o onclick="fill(0)">Sample: GCash</button><button class=o onclick="fill(1)">Sample: Maya</button><button class=o onclick="fill(2)">Sample: GoTyme</button></div></div>${p?(p.err?`<div class=c><b class=x>${p.err}</b></div>`:`<div class=c><b>Detected</b><div class=r><span>Amount</span><b>${$(p.a)}</b></div><div class=r><span>Direction</span><b>${p.dir>0?'In':'Out'}</b></div><div class=r><span>Merchant</span><b>${E(p.s)}</b></div><div class=r><span>Category</span><b>${p.c}</b></div><div class=m>Wallet</div><select id=pw>${wopt(p.w)}</select><button onclick="okp()">Confirm and add</button></div>`):''}`},
bill:()=>`<div class=hd><div class=h>Bills</div><button onclick="op('bill')">+ Add bill</button></div><div class=d><div class=m>Reserved this period</div><div class=k>${$(res())}</div></div><div class=c>${S.b.map(b=>`<div class=r><div><b>${E(b.n)}</b><div class=m>Due ${E(b.d)}</div></div><b>${$(b.a)}</b><button class=dg onclick="S.b=S.b.filter(x=>x.id!=${b.id});R()">✕</button></div>`).join('')||'<div class=m>No bills.</div>'}</div>`,
ins:()=>{const m={};S.t.filter(t=>t.a<0).forEach(t=>m[t.c]=(m[t.c]||0)-t.a);const inc=S.t.filter(t=>t.a>0).reduce((s,t)=>s+t.a,0),out=Object.values(m).reduce((s,v)=>s+v,0),mx=Math.max(1,...Object.values(m));
return `<div class=h>Insights</div><div class=gr><div class=c><b>Income vs expenses</b><div class=r><span>In</span><div class=ln><i style="width:100%;background:#15803D"></i></div><b>${$(inc)}</b></div><div class=r><span>Out</span><div class=ln><i style="width:${inc?Math.min(100,out/inc*100):0}%"></i></div><b>${$(out)}</b></div></div><div class=c><b>Top categories</b>${Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class=r><span>${k}</span><div class=ln><i style="width:${v/mx*100}%"></i></div><b>${$(v)}</b></div>`).join('')||'<div class=m>No spending yet.</div>'}</div></div>`},
set:()=>`<div class=h>Settings</div><div class=c><div class=r><span>Sign out</span><button class=o onclick="go('login')">Sign out</button></div><div class=r><span>Reset demo data</span><button class=dg onclick="S=seed();go('dash')">Reset</button></div></div>`};
function R(){const a=document.getElementById('app');if(S.view=='login'){a.innerHTML=VW.login();return}
const nav=[['dash','Dashboard'],['wal','Wallets'],['tx','Transactions'],['imp','Import'],['bill','Bills'],['ins','Insights'],['set','Settings']];
a.innerHTML=`<div class=app><div class=sb><b>◎ One Wallet</b>${nav.map(([k,l])=>`<a class="${S.view==k?'a':''}" onclick="go('${k}')">${l}</a>`).join('')}</div><div class=mn>${VW[S.view]()}</div></div>${S.modal?`<div class=ov><div class=mo>${M[S.modal]()}</div></div>`:''}`}
R();
</script></body></html>
