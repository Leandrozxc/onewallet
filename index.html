<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#F8FAFC">
  <title>One Wallet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="./dist/output.css" rel="stylesheet">
</head>
<body class="bg-paper text-ink font-sans antialiased">
<div id="app"></div>
<script>
/* ---------- Constants & formatting ---------- */
const TODAY = '2026-09-30';
const PAYDAY = '2026-10-15';
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CATEGORIES = ['Food', 'Transport', 'Load', 'Bills', 'Income', 'Others'];

const peso = n => '₱' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const signed = n => (n < 0 ? '− ' : '+ ') + peso(n);
const esc = t => String(t ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const val = id => (document.getElementById(id)?.value ?? '').trim();
const shortDate = md => { const [m, d] = md.split('-').map(Number); return `${MONTHS[m - 1]} ${d}`; };
const dayLabel = md => {
  const today = TODAY.slice(5);
  const y = new Date(TODAY); y.setDate(y.getDate() - 1);
  const yesterday = String(y.getMonth() + 1).padStart(2, '0') + '-' + String(y.getDate()).padStart(2, '0');
  if (md === today) return `Today · ${shortDate(md)}`;
  if (md === yesterday) return `Yesterday · ${shortDate(md)}`;
  return shortDate(md);
};

/* ---------- Icons (one 1.5px line family) ---------- */
const icon = (d, cls = 'w-5 h-5') => `<svg class="${cls} shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I = {
  today: '<path d="M4 5h16v15H4z"/><path d="M4 9h16M9 3v4M15 3v4"/>',
  ledger: '<path d="M6 3h12v18H6z"/><path d="M9 8h6M9 12h6M9 16h4"/>',
  import: '<path d="M12 4v11"/><path d="m7 10 5 5 5-5"/><path d="M5 20h14"/>',
  bills: '<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
  menu: '<path d="M4 7h16M4 12h16M4 17h16"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>',
  back: '<path d="M15 5l-7 7 7 7"/>',
  trash: '<path d="M5 7h14M10 11v6M14 11v6M7 7l1 13h8l1-13M9 7V4h6v3"/>',
  chevron: '<path d="m9 5 7 7-7 7"/>'
};

/* ---------- Shared class vocabulary ---------- */
const C = {
  card: 'bg-card border border-line rounded-card',
  btn: 'inline-flex items-center justify-center gap-1.5 h-10 px-4 rounded-ctl bg-ink text-card text-[15px] font-medium hover:bg-ink-2 active:scale-[0.97] transition-[transform,background-color] duration-100 cursor-pointer',
  btn2: 'inline-flex items-center justify-center gap-1.5 h-10 px-4 rounded-ctl bg-card text-ink border border-ink text-[15px] font-medium hover:bg-paper active:scale-[0.97] transition-[transform,background-color] duration-100 cursor-pointer',
  btnDanger: 'inline-flex items-center justify-center gap-1.5 h-10 px-4 rounded-ctl bg-alert text-card text-[15px] font-medium hover:opacity-90 active:scale-[0.97] transition-transform duration-100 cursor-pointer',
  link: 'text-[15px] font-medium text-ink underline-offset-4 hover:underline cursor-pointer',
  iconBtn: 'inline-flex items-center justify-center w-9 h-9 rounded-ctl text-mute hover:text-ink hover:bg-paper cursor-pointer',
  label: 'block text-sm font-medium text-ink mb-1.5',
  input: 'w-full h-10 px-3 rounded-ctl bg-card border border-line text-[15px] text-ink placeholder:text-mute focus:outline-none focus:border-ink focus:ring-1 focus:ring-ink aria-[invalid=true]:border-alert aria-[invalid=true]:ring-1 aria-[invalid=true]:ring-alert',
  cardTitle: 'text-lg font-semibold text-ink',
  meta: 'text-sm text-mute',
  h1: 'text-[30px] leading-tight font-semibold text-ink tracking-[-0.01em]'
};

/* ---------- State ---------- */
const seed = () => ({
  view: 'login', wid: 0, fw: 0, modal: '', pr: null, raw: '', draft: {}, errors: {}, n: 20,
  w: [{ id: 1, n: 'GCash', b: 1200 }, { id: 2, n: 'Maya', b: 2100 }, { id: 3, n: 'GoTyme', b: 800 }, { id: 4, n: 'Cash', b: 150 }],
  t: [
    { id: 1, d: '09-30', s: 'Jollibee', c: 'Food', w: 1, a: -189 },
    { id: 2, d: '09-30', s: 'Salary', c: 'Income', w: 2, a: 12000 },
    { id: 3, d: '09-29', s: 'Load', c: 'Load', w: 1, a: -50 },
    { id: 4, d: '09-29', s: 'Grab', c: 'Transport', w: 1, a: -140 }
  ],
  b: [{ id: 1, n: 'Wi-Fi', a: 1299, d: 'Oct 5' }, { id: 2, n: 'Spotify', a: 200, d: 'Oct 9' }]
});
let S = seed();
try { const saved = JSON.parse(localStorage.getItem('onewallet')); if (saved) S = { ...S, ...saved }; } catch (e) {}

const walletName = id => esc(S.w.find(x => x.id == id)?.n ?? 'Deleted wallet');
const total = () => S.w.reduce((s, w) => s + w.b, 0);
const reserved = () => S.b.reduce((s, b) => s + b.a, 0);
const daysLeft = () => Math.max(1, Math.round((new Date(PAYDAY) - new Date(TODAY)) / 864e5));
const free = () => Math.max(0, total() - reserved());
const perDay = () => free() / daysLeft();

/* ---------- Navigation ---------- */
function go(v) {
  if (location.hash === '#' + v) { S.view = v; S.wid = 0; S.pr = null; R(); }
  else location.hash = v;
}
function signIn() { location.replace('#today'); }          // one-way door: Back never returns to sign-in
function signOut() { S.modal = ''; location.replace('#login'); }
function openModal(m) { S.modal = m; S.draft = {}; S.errors = {}; R(); }
function closeModal() { S.modal = ''; S.draft = {}; S.errors = {}; R(); }
let keepWallet = false;
function openWallet(id) { S.wid = id; if (S.view !== 'wallets') { keepWallet = true; go('wallets'); } else R(); }

/* ---------- Mutations ---------- */
function addTx(w, a, s, c) { S.t.unshift({ id: ++S.n, d: TODAY.slice(5), s, c, w: +w, a }); const wl = S.w.find(z => z.id == w); if (wl) wl.b += a; }
function delTx(id) { const t = S.t.find(x => x.id == id); if (!t) return; const wl = S.w.find(z => z.id == t.w); if (wl) wl.b -= t.a; S.t = S.t.filter(x => x.id != id); R(); }
function delBill(id) { S.b = S.b.filter(x => x.id != id); R(); }

function fail(errors, fields) { S.errors = errors; S.draft = Object.fromEntries(fields.map(f => [f, val(f)])); R(); }

function saveTx() {
  const a = parseFloat(val('am'));
  if (!(a > 0)) return fail({ am: 'Enter an amount greater than ₱0.' }, ['ty', 'am', 'mw', 'mc', 'nt']);
  addTx(val('mw'), +val('ty') * a, val('nt') || (val('ty') === '1' ? 'Income' : 'Expense'), val('mc'));
  closeModal();
}
function saveWallet() {
  const n = val('wnm'), b = val('wb') === '' ? 0 : parseFloat(val('wb'));
  const e = {};
  if (!n) e.wnm = 'Give this wallet a name.';
  if (isNaN(b)) e.wb = 'Enter a number, or leave it blank for ₱0.';
  if (Object.keys(e).length) return fail(e, ['wnm', 'wb']);
  S.w.push({ id: ++S.n, n, b });
  closeModal();
}
function saveBill() {
  const n = val('bn'), a = parseFloat(val('ba')), d = val('bd');
  const e = {};
  if (!n) e.bn = 'Name the bill.';
  if (!(a > 0)) e.ba = 'Enter an amount greater than ₱0.';
  if (Object.keys(e).length) return fail(e, ['bn', 'ba', 'bd']);
  S.b.push({ id: ++S.n, n, a, d: d || 'No due date' });
  closeModal();
}
function saveReconcile() {
  const w = S.w.find(x => x.id == S.wid), real = parseFloat(val('rb'));
  if (isNaN(real)) return fail({ rb: 'Enter the balance your app shows.' }, ['rb']);
  const diff = Math.round((real - w.b) * 100) / 100;
  if (diff) addTx(w.id, diff, 'Balance correction', 'Others');
  closeModal();
}
function resetData() { S = { ...seed(), view: S.view }; try { localStorage.removeItem('onewallet'); } catch (e) {} closeModal(); go('today'); }

/* ---------- Alert import ---------- */
const SAMPLES = [
  'GCash: You have paid ₱189.00 to Jollibee. Ref 5012 884 991.',
  'Maya: You received ₱1,500.00 from Juan Dela Cruz.',
  'GoTyme: You sent ₱350.00 to Grab. Ref 88231.'
];
function fillSample(i) { S.raw = SAMPLES[i]; S.pr = null; R(); document.getElementById('raw')?.focus(); }
function readAlert() {
  const x = S.raw = val('raw');
  if (!x) { S.pr = { err: 'Paste an alert first, or try one of the samples.' }; return R(); }
  const amt = (x.match(/(?:₱|PHP\s?)\s?([\d,]+(?:\.\d+)?)/i) || [])[1];
  if (!amt) { S.pr = { err: 'We couldn’t find a peso amount. Alerts usually look like “paid ₱189.00 to …”.' }; return R(); }
  const isIn = /received|credited|cash[- ]?in|deposit/i.test(x), isOut = /paid|sent|transferred|purchase|debited|cash[- ]?out/i.test(x);
  const s = (x.match(/(?:to|from|at)\s+([A-Z][\w&' -]*?)(?:\.|,|\s+Ref|$)/) || [])[1] || 'Unknown';
  const w = S.w.find(z => new RegExp(z.n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'i').test(x));
  const c = isIn && !isOut ? 'Income' : /jollibee|mcdo|food|coffee|milk ?tea/i.test(x) ? 'Food' : /grab|angkas|jeep|mrt|lrt/i.test(x) ? 'Transport' : /load|globe|smart/i.test(x) ? 'Load' : /meralco|wi-?fi|water|converge/i.test(x) ? 'Bills' : 'Others';
  S.pr = { a: parseFloat(amt.replace(/,/g, '')), dir: isIn && !isOut ? 1 : -1, s, c, w: w ? w.id : S.w[0]?.id };
  R();
}
function confirmAlert() { const p = S.pr; addTx(val('pw'), p.a * p.dir, p.s, p.c); S.pr = null; S.raw = ''; go('ledger'); }

/* ---------- Building blocks ---------- */
const field = (id, label, input, hint = '') => {
  const err = S.errors[id];
  return `<div class="mb-4">
    <label class="${C.label}" for="${id}">${label}</label>
    ${input}
    ${err ? `<p id="${id}-err" class="mt-1.5 text-sm text-alert">${esc(err)}</p>` : hint ? `<p class="mt-1.5 text-sm text-mute">${hint}</p>` : ''}
  </div>`;
};
const inputAttrs = id => `id="${id}" name="${id}" class="${C.input}" ${S.errors[id] ? `aria-invalid="true" aria-describedby="${id}-err"` : ''}`;
const draft = (id, fallback = '') => esc(S.draft[id] ?? fallback);
const walletOptions = sel => S.w.map(w => `<option value="${w.id}" ${w.id == sel ? 'selected' : ''}>${esc(w.n)}</option>`).join('');

function txRow(t, deletable) {
  return `<li class="flex items-center gap-3 py-[7px]">
    <span class="w-[34px] h-[34px] rounded-full bg-track text-ink-2 text-[15px] font-medium flex items-center justify-center shrink-0" aria-hidden="true">${esc(t.s.charAt(0).toUpperCase())}</span>
    <div class="min-w-0 flex-1">
      <div class="text-base text-ink truncate">${esc(t.s)}</div>
      <div class="${C.meta} truncate">${esc(t.c)} · ${walletName(t.w)}</div>
    </div>
    <span class="tnum text-base font-medium whitespace-nowrap ${t.a > 0 ? 'text-gain' : 'text-ink'}">${signed(t.a)}</span>
    ${deletable ? `<button type="button" class="${C.iconBtn} -mr-2" onclick="delTx(${t.id})" aria-label="Delete ${esc(t.s)}, ${signed(t.a)}">${icon(I.trash, 'w-[18px] h-[18px]')}</button>` : ''}
  </li>`;
}
function ledgerList(list, { deletable = false, limit = Infinity, empty = 'No entries yet.' } = {}) {
  const rows = list.slice(0, limit);
  if (!rows.length) return `<p class="py-8 text-center ${C.meta}">${empty}</p>`;
  const groups = [];
  rows.forEach(t => { const g = groups.at(-1); if (g && g.d === t.d) g.items.push(t); else groups.push({ d: t.d, items: [t] }); });
  return groups.map(g => `<section class="mt-3 first:mt-1">
    <h3 class="text-[15px] font-medium text-ink pb-0.5">${dayLabel(g.d)}</h3>
    <ul>${g.items.map(t => txRow(t, deletable)).join('')}</ul>
  </section>`).join('');
}
const pageHead = (title, sub, actions = '') => `
  <header class="flex flex-wrap items-center justify-between gap-4 mb-4">
    <div>
      ${sub ? `<p class="text-[15px] text-ink-2 mb-0.5">${sub}</p>` : ''}
      <h1 class="${C.h1}">${title}</h1>
    </div>
    ${actions ? `<div class="flex gap-2.5">${actions}</div>` : ''}
  </header>`;
const cardHead = (title, action = '') => `<div class="flex items-center justify-between mb-1"><h2 class="${C.cardTitle}">${title}</h2>${action}</div>`;
const longDate = () => new Date(TODAY).toLocaleDateString('en-US', { weekday: 'long', month: 'short', day: 'numeric' });

/* ---------- Dialogs ---------- */
const dialogShell = (title, body, actions) => `
  <div class="flex items-center justify-between mb-5">
    <h2 id="modal-title" class="text-xl font-semibold text-ink">${title}</h2>
    <button type="button" class="${C.iconBtn} -mr-2" onclick="closeModal()" aria-label="Close">${icon(I.close)}</button>
  </div>
  ${body}
  <div class="flex justify-end gap-2.5 mt-6">${actions}</div>`;
const cancelBtn = `<button type="button" class="${C.btn2}" onclick="closeModal()">Cancel</button>`;

const M = {
  tx: () => dialogShell('Add entry', `
    <div class="grid grid-cols-2 gap-x-3">
      ${field('ty', 'Type', `<select ${inputAttrs('ty')}><option value="-1" ${S.draft.ty === '1' ? '' : 'selected'}>Expense</option><option value="1" ${S.draft.ty === '1' ? 'selected' : ''}>Income</option></select>`)}
      ${field('am', 'Amount', `<input ${inputAttrs('am')} type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="${draft('am')}" data-autofocus>`)}
    </div>
    <div class="grid grid-cols-2 gap-x-3">
      ${field('mw', 'Wallet', `<select ${inputAttrs('mw')}>${walletOptions(S.draft.mw)}</select>`)}
      ${field('mc', 'Category', `<select ${inputAttrs('mc')}>${CATEGORIES.map(c => `<option ${S.draft.mc === c ? 'selected' : ''}>${c}</option>`).join('')}</select>`)}
    </div>
    ${field('nt', 'Merchant or note', `<input ${inputAttrs('nt')} placeholder="e.g. Jollibee" value="${draft('nt')}">`, 'Optional')}`,
    `${cancelBtn}<button type="button" class="${C.btn}" onclick="saveTx()">Save entry</button>`),

  wallet: () => dialogShell('Add wallet', `
    ${field('wnm', 'Name', `<input ${inputAttrs('wnm')} placeholder="e.g. MariBank" value="${draft('wnm')}" data-autofocus>`)}
    ${field('wb', 'Current balance', `<input ${inputAttrs('wb')} type="number" inputmode="decimal" step="0.01" placeholder="0.00" value="${draft('wb')}">`, 'What the wallet’s app shows right now.')}`,
    `${cancelBtn}<button type="button" class="${C.btn}" onclick="saveWallet()">Add wallet</button>`),

  bill: () => dialogShell('Set aside a bill', `
    ${field('bn', 'Bill', `<input ${inputAttrs('bn')} placeholder="e.g. Converge" value="${draft('bn')}" data-autofocus>`)}
    <div class="grid grid-cols-2 gap-x-3">
      ${field('ba', 'Amount', `<input ${inputAttrs('ba')} type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" value="${draft('ba')}">`)}
      ${field('bd', 'Due', `<input ${inputAttrs('bd')} placeholder="e.g. Oct 12" value="${draft('bd')}">`, 'Optional')}
    </div>
    <p class="${C.meta}">This amount is taken out before your daily safe-to-spend is worked out.</p>`,
    `${cancelBtn}<button type="button" class="${C.btn}" onclick="saveBill()">Set aside</button>`),

  reconcile: () => {
    const w = S.w.find(x => x.id == S.wid);
    return dialogShell(`Correct ${esc(w.n)} balance`, `
      <p class="text-[15px] text-ink-2 mb-4">One Wallet has <b class="tnum font-semibold text-ink">${peso(w.b)}</b>. Enter what the ${esc(w.n)} app actually shows, and we’ll add a correction entry for the difference.</p>
      ${field('rb', 'Balance in the app', `<input ${inputAttrs('rb')} type="number" inputmode="decimal" step="0.01" placeholder="${w.b.toFixed(2)}" value="${draft('rb')}" data-autofocus>`)}`,
      `${cancelBtn}<button type="button" class="${C.btn}" onclick="saveReconcile()">Save correction</button>`);
  },

  reset: () => dialogShell('Reset demo data?', `
    <p class="text-[15px] text-ink-2">This replaces every wallet, entry and bill in this browser with the original sample data. It can’t be undone.</p>`,
    `${cancelBtn}<button type="button" class="${C.btnDanger}" onclick="resetData()" data-autofocus>Reset data</button>`)
};

/* ---------- Views ---------- */
const V = {
  login: () => `
    <main class="min-h-dvh flex items-center justify-center p-6">
      <div class="w-full max-w-[400px]">
        <div class="flex items-center gap-2.5 mb-8">
          <span class="w-8 h-8 rounded-ctl bg-ink flex items-center justify-center" aria-hidden="true"><span class="w-3.5 h-2.5 rounded-[2px] bg-card"></span></span>
          <span class="text-lg font-semibold">One Wallet</span>
        </div>
        <h1 class="${C.h1} mb-2">Know what you can spend today.</h1>
        <p class="text-[15px] text-ink-2 mb-6">GCash, Maya, GoTyme and cash in one ledger, with bills set aside and a safe daily amount until payday.</p>
        <div class="${C.card} p-5">
          ${field('login-email', 'Email', `<input id="login-email" class="${C.input}" type="email" autocomplete="username" value="demo@onewallet.ph">`)}
          ${field('login-pwd', 'Password', `<input id="login-pwd" class="${C.input}" type="password" autocomplete="current-password" value="demo1234">`)}
          <button type="button" class="${C.btn} w-full" onclick="signIn()">Sign in</button>
        </div>
        <p class="${C.meta} mt-4">Demo build: any email works. Data stays in this browser.</p>
      </div>
    </main>`,

  today: () => {
    const tot = total(), nb = S.b.length;
   return `
      ${pageHead('Today', longDate(), `
        <button type="button" class="${C.btn2} max-sm:hidden" onclick="go('import')">Import alert</button>
        <button type="button" class="${C.btn}" onclick="openModal('tx')">${icon(I.plus, 'w-[18px] h-[18px]')}Add entry</button>`)}

      <section class="bg-marigold rounded-card px-4 py-[9px] flex flex-wrap items-center justify-between gap-x-10 gap-y-4 mb-4" aria-labelledby="runway-label">
        <div>
          <p id="runway-label" class="text-base text-ink">Safe to spend per day</p>
          <p class="tnum text-[48px] leading-[1.1] font-semibold tracking-[-0.02em] my-0.5">${peso(perDay())}</p>
          <p class="text-base text-ink">for the next ${daysLeft()} days, until payday on ${shortDate(PAYDAY.slice(5))}</p>
        </div>
        <dl class="tnum text-base w-full sm:w-[330px]">
          <div class="flex justify-between py-0.5"><dt>Across ${S.w.length} wallet${S.w.length === 1 ? '' : 's'}</dt><dd>${peso(tot)}</dd></div>
          <div class="flex justify-between py-0.5 border-b border-ink/80 pb-1"><dt>Set aside for ${nb} bill${nb === 1 ? '' : 's'}</dt><dd>− ${peso(reserved())}</dd></div>
          <div class="flex justify-between pt-1.5 py-0.5"><dt>Free to spend</dt><dd>${peso(free())}</dd></div>
          <div class="flex justify-between py-0.5 font-semibold"><dt class="font-normal">÷ ${daysLeft()} days</dt><dd>${peso(perDay())} / day</dd></div>
        </dl>
      </section>

      <div class="grid gap-4 lg:grid-cols-[1.23fr_1fr] items-start">
        <section class="${C.card} px-4 pt-4 pb-2">
          ${cardHead('Ledger', `<a href="#ledger" class="${C.link}">See all</a>`)}
          ${ledgerList(S.t, { limit: 5, empty: 'No entries yet. Add one or import an alert.' })}
        </section>

        <div class="grid gap-4">
          <section class="${C.card} p-4">
            ${cardHead('Wallets', `<button type="button" class="${C.link} inline-flex items-center gap-1" onclick="openModal('wallet')">${icon(I.plus, 'w-4 h-4')}Add</button>`)}
            <ul class="mt-2">
              ${S.w.map(w => `<li>
                <button type="button" class="w-full text-left py-0 group cursor-pointer" onclick="openWallet(${w.id})" aria-label="${esc(w.n)}, ${peso(w.b)}. Open wallet">
                  <span class="flex justify-between text-base"><span class="group-hover:underline underline-offset-4">${esc(w.n)}</span><span class="tnum">${peso(w.b)}</span></span>
                  <span class="block h-[3px] mt-1 rounded-full bg-track overflow-hidden"><span class="block h-full rounded-full bg-ink" style="width:${tot > 0 ? Math.max(0, w.b) / tot * 100 : 0}%"></span></span>
                </button>
              </li>`).join('') || `<li class="py-4 ${C.meta}">No wallets yet.</li>`}
            </ul>
            <div class="flex justify-between text-base font-medium pt-2 mt-1 border-t border-line"><span>Total</span><span class="tnum">${peso(tot)}</span></div>
          </section>

          <section class="${C.card} p-4">
            ${cardHead('Bills set aside', `<a href="#bills" class="${C.link}">Manage</a>`)}
            <ul class="mt-1">
              ${S.b.map(b => `<li class="flex justify-between text-base py-1.5"><span>${esc(b.n)} <span class="text-mute">· due ${esc(b.d)}</span></span><span class="tnum">${peso(b.a)}</span></li>`).join('') || `<li class="py-3 ${C.meta}">Nothing set aside.</li>`}
            </ul>
          </section>
        </div>
      </div>`;
  },

  wallets: () => {
    const w = S.w.find(x => x.id == S.wid);
    if (w) {
      const list = S.t.filter(t => t.w == w.id);
      return `
        <button type="button" class="${C.link} inline-flex items-center gap-1 mb-3 -ml-1" onclick="S.wid=0;R()">${icon(I.back, 'w-4 h-4')}All wallets</button>
        ${pageHead(esc(w.n), 'Wallet', `<button type="button" class="${C.btn2}" onclick="openModal('reconcile')">Correct balance</button>`)}
        <section class="${C.card} p-5 mb-4">
          <p class="text-base text-ink-2">Balance in One Wallet</p>
          <p class="tnum text-[40px] leading-tight font-semibold tracking-[-0.02em]">${peso(w.b)}</p>
          <p class="${C.meta} mt-1">${list.length} entr${list.length === 1 ? 'y' : 'ies'} · If this differs from the ${esc(w.n)} app, use Correct balance.</p>
        </section>
        <section class="${C.card} px-4 pt-4 pb-2">
          ${cardHead('Entries')}
          ${ledgerList(list, { deletable: true, empty: `No entries for ${esc(w.n)} yet.` })}
        </section>`;
    }
    const tot = total();
    return `
      ${pageHead('Wallets', `${S.w.length} wallets · ${peso(tot)} total`, `<button type="button" class="${C.btn}" onclick="openModal('wallet')">${icon(I.plus, 'w-[18px] h-[18px]')}Add wallet</button>`)}
      <section class="${C.card}">
        <ul class="divide-y divide-line">
          ${S.w.map(w => {
            const count = S.t.filter(t => t.w == w.id).length;
            return `<li><button type="button" class="w-full flex items-center gap-4 px-4 py-3.5 text-left hover:bg-paper cursor-pointer" onclick="openWallet(${w.id})">
              <span class="flex-1 min-w-0"><span class="block text-base font-medium">${esc(w.n)}</span><span class="block ${C.meta}">${count} entr${count === 1 ? 'y' : 'ies'} · ${tot > 0 ? Math.round(Math.max(0, w.b) / tot * 100) : 0}% of total</span></span>
              <span class="tnum text-base">${peso(w.b)}</span>
              <span class="text-mute">${icon(I.chevron, 'w-4 h-4')}</span>
            </button></li>`;
          }).join('') || `<li class="p-8 text-center ${C.meta}">Add your first wallet to start.</li>`}
        </ul>
      </section>`;
  },

  ledger: () => {
    const list = S.t.filter(t => !S.fw || t.w == S.fw);
    const chip = (id, label) => `<button type="button" role="radio" aria-checked="${S.fw == id}" class="h-9 px-3.5 rounded-full text-[15px] border cursor-pointer ${S.fw == id ? 'bg-ink text-card border-ink' : 'bg-card text-ink border-line hover:border-ink'}" onclick="S.fw=${id};R()">${label}</button>`;
    return `
      ${pageHead('Ledger', `${S.t.length} entries`, `<button type="button" class="${C.btn}" onclick="openModal('tx')">${icon(I.plus, 'w-[18px] h-[18px]')}Add entry</button>`)}
      <div role="radiogroup" aria-label="Filter by wallet" class="flex flex-wrap gap-2 mb-4">${chip(0, 'All wallets')}${S.w.map(w => chip(w.id, esc(w.n))).join('')}</div>
      <section class="${C.card} px-4 pt-3 pb-2">
        ${ledgerList(list, { deletable: true, empty: S.fw ? 'No entries for this wallet.' : 'No entries yet. Add one or import an alert.' })}
      </section>`;
  },

  import: () => {
    const p = S.pr;
    return `
      ${pageHead('Import alert', 'Turn a payment SMS into an entry')}
      <section class="${C.card} p-5 mb-4">
        <label class="${C.label}" for="raw">Paste the alert text</label>
        <textarea id="raw" rows="3" class="${C.input} h-auto py-2.5 leading-relaxed resize-y" placeholder="GCash: You have paid ₱189.00 to Jollibee. Ref 5012 884 991.">${esc(S.raw)}</textarea>
        <div class="flex flex-wrap items-center justify-between gap-3 mt-4">
          <button type="button" class="${C.btn}" onclick="readAlert()">Read alert</button>
          <div class="flex flex-wrap items-center gap-2"><span class="${C.meta}">Try a sample:</span>
            ${['GCash', 'Maya', 'GoTyme'].map((n, i) => `<button type="button" class="h-8 px-3 rounded-full text-sm border border-line bg-card hover:border-ink cursor-pointer" onclick="fillSample(${i})">${n}</button>`).join('')}
          </div>
        </div>
      </section>
      ${p ? p.err ? `
        <div role="alert" class="${C.card} border-alert p-4 text-[15px] text-alert">${esc(p.err)}</div>` : `
        <section class="${C.card} p-5" aria-labelledby="found">
          <h2 id="found" class="${C.cardTitle} mb-3">Here’s what we found</h2>
          <dl class="tnum text-base divide-y divide-line border-y border-line mb-5">
            <div class="flex justify-between py-2"><dt class="text-ink-2">Amount</dt><dd class="font-medium ${p.dir > 0 ? 'text-gain' : ''}">${signed(p.a * p.dir)}</dd></div>
            <div class="flex justify-between py-2"><dt class="text-ink-2">Type</dt><dd>${p.dir > 0 ? 'Income' : 'Expense'}</dd></div>
            <div class="flex justify-between py-2"><dt class="text-ink-2">${p.dir > 0 ? 'From' : 'To'}</dt><dd>${esc(p.s)}</dd></div>
            <div class="flex justify-between py-2"><dt class="text-ink-2">Category</dt><dd>${esc(p.c)}</dd></div>
          </dl>
          <div class="flex flex-wrap items-end gap-3">
            <div class="flex-1 min-w-[200px]">${field('pw', 'Add to wallet', `<select id="pw" class="${C.input}">${walletOptions(p.w)}</select>`).replace('mb-4', 'mb-0')}</div>
            <button type="button" class="${C.btn}" onclick="confirmAlert()">Add to ledger</button>
          </div>
        </section>` : ''}`;
  },

  bills: () => `
    ${pageHead('Bills', `${peso(reserved())} set aside until payday`, `<button type="button" class="${C.btn}" onclick="openModal('bill')">${icon(I.plus, 'w-[18px] h-[18px]')}Set aside a bill</button>`)}
    <section class="${C.card}">
      <ul class="divide-y divide-line">
        ${S.b.map(b => `<li class="flex items-center gap-4 px-4 py-3">
          <span class="flex-1 min-w-0"><span class="block text-base font-medium">${esc(b.n)}</span><span class="block ${C.meta}">Due ${esc(b.d)}</span></span>
          <span class="tnum text-base">${peso(b.a)}</span>
          <button type="button" class="${C.iconBtn} -mr-2" onclick="delBill(${b.id})" aria-label="Remove ${esc(b.n)}">${icon(I.trash, 'w-[18px] h-[18px]')}</button>
        </li>`).join('') || `<li class="p-8 text-center ${C.meta}">No bills set aside. Add rent, Wi-Fi or subscriptions so your daily amount stays honest.</li>`}
      </ul>
      ${S.b.length ? `<div class="flex justify-between px-4 py-3 border-t border-line text-base font-medium"><span>Total set aside</span><span class="tnum">${peso(reserved())}</span></div>` : ''}
    </section>`,

  insights: () => {
    const byCat = {};
    S.t.filter(t => t.a < 0 && t.s !== 'Balance correction').forEach(t => byCat[t.c] = (byCat[t.c] || 0) - t.a);
    const inc = S.t.filter(t => t.a > 0 && t.s !== 'Balance correction').reduce((s, t) => s + t.a, 0);
    const out = Object.values(byCat).reduce((s, v) => s + v, 0);
    const max = Math.max(1, ...Object.values(byCat));
    const bar = (pct, cls = 'bg-ink') => `<span class="block h-1.5 rounded-full bg-track overflow-hidden"><span class="block h-full rounded-full ${cls}" style="width:${pct}%"></span></span>`;
    return `
      ${pageHead('Insights', 'Where the money went this period')}
      <div class="grid gap-4 lg:grid-cols-2 items-start">
        <section class="${C.card} p-4">
          ${cardHead('Money in vs out')}
          <div class="mt-3 space-y-4 tnum text-base">
            <div><div class="flex justify-between mb-1.5"><span>In</span><span class="text-gain">${peso(inc)}</span></div>${bar(inc ? 100 : 0, 'bg-gain')}</div>
            <div><div class="flex justify-between mb-1.5"><span>Out</span><span>${peso(out)}</span></div>${bar(inc ? Math.min(100, out / inc * 100) : out ? 100 : 0)}</div>
            <p class="${C.meta}">${inc ? `You’ve spent ${Math.round(out / inc * 100)}% of what came in.` : 'No income recorded yet.'}</p>
          </div>
        </section>
        <section class="${C.card} p-4">
          ${cardHead('Spending by category')}
          <ul class="mt-3 space-y-3 tnum text-base">
            ${Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<li><div class="flex justify-between mb-1.5"><span>${esc(k)}</span><span>${peso(v)}</span></div>${bar(v / max * 100)}</li>`).join('') || `<li class="${C.meta} py-4">No spending recorded yet.</li>`}
          </ul>
        </section>
      </div>`;
  },

  settings: () => `
    ${pageHead('Settings')}
    <section class="${C.card} divide-y divide-line">
      <div class="flex flex-wrap items-center justify-between gap-3 p-4">
        <div><p class="text-base font-medium">Sign out</p><p class="${C.meta}">Your data stays saved in this browser.</p></div>
        <button type="button" class="${C.btn2}" onclick="signOut()">Sign out</button>
      </div>
      <div class="flex flex-wrap items-center justify-between gap-3 p-4">
        <div><p class="text-base font-medium">Reset demo data</p><p class="${C.meta}">Replace everything with the original sample wallets, entries and bills.</p></div>
        <button type="button" class="${C.btn2} !border-alert !text-alert" onclick="openModal('reset')">Reset…</button>
      </div>
    </section>`,

  help: () => `
    ${pageHead('Help')}
    <div class="grid gap-4 lg:grid-cols-2 items-start">
      <section class="${C.card} p-4">
        ${cardHead('How the daily amount works')}
        <ol class="mt-2 space-y-2 text-base text-ink-2 list-decimal pl-5">
          <li>Add each wallet with the balance its app shows.</li>
          <li>Set aside bills due before payday.</li>
          <li>What’s left, divided by the days until payday, is your safe amount per day.</li>
        </ol>
      </section>
      <section class="${C.card} p-4">
        ${cardHead('Questions')}
        <dl class="mt-2 space-y-3 text-base">
          <div><dt class="font-medium">Does it connect to my bank?</dt><dd class="text-ink-2">No. It only reads alert text you paste in.</dd></div>
          <div><dt class="font-medium">Is my data uploaded?</dt><dd class="text-ink-2">No. Everything stays in this browser.</dd></div>
          <div><dt class="font-medium">A balance looks wrong.</dt><dd class="text-ink-2">Open the wallet and choose Correct balance. We add an entry for the difference so your history stays traceable.</dd></div>
        </dl>
      </section>
    </div>`,

  more: () => `
    ${pageHead('More')}
    <section class="${C.card}">
      <ul class="divide-y divide-line">
        ${[['wallets', 'Wallets'], ['insights', 'Insights'], ['settings', 'Settings'], ['help', 'Help']].map(([k, l]) => `<li><a href="#${k}" class="flex items-center justify-between px-4 py-3.5 text-base hover:bg-paper">${l}<span class="text-mute">${icon(I.chevron, 'w-4 h-4')}</span></a></li>`).join('')}
      </ul>
    </section>`
};

/* ---------- Shell & render ---------- */
const NAV = [['today', 'Today'], ['wallets', 'Wallets'], ['ledger', 'Ledger'], ['import', 'Import alert'], ['bills', 'Bills'], ['insights', 'Insights']];
const NAV2 = [['settings', 'Settings'], ['help', 'Help']];
const TABS = [['today', 'Today', I.today], ['ledger', 'Ledger', I.ledger], ['import', 'Import', I.import], ['bills', 'Bills', I.bills], ['more', 'More', I.menu]];
const MORE_GROUP = ['more', 'wallets', 'insights', 'settings', 'help'];

const navLink = ([k, l]) => {
  const on = S.view === k;
  return `<a href="#${k}" ${on ? 'aria-current="page"' : ''} class="relative flex items-center h-[35px] pl-[31px] pr-3 text-base ${on ? 'font-semibold text-ink' : 'text-ink-2 hover:text-ink'}">
    ${on ? '<span class="absolute left-0 top-1 bottom-1 w-1 rounded-r-full bg-marigold" aria-hidden="true"></span>' : ''}${l}</a>`;
};

function R() {
  try { localStorage.setItem('onewallet', JSON.stringify({ w: S.w, t: S.t, b: S.b, n: S.n })); } catch (e) {}
  const app = document.getElementById('app');
  if (S.view === 'login') { app.innerHTML = V.login(); document.title = 'Sign in · One Wallet'; return; }

  const label = [...NAV, ...NAV2, ['more', 'More']].find(n => n[0] === S.view)?.[1] ?? 'One Wallet';
  document.title = `${label} · One Wallet`;

  app.innerHTML = `
    <div class="min-h-dvh md:grid md:grid-cols-[244px_1fr]">
      <aside class="max-md:hidden sticky top-0 h-dvh flex flex-col border-r border-line">
        <a href="#today" class="flex items-center gap-2.5 px-[31px] pt-7 pb-[30px]">
          <span class="w-[30px] h-[30px] rounded-ctl bg-ink flex items-center justify-center" aria-hidden="true"><span class="w-3.5 h-2.5 rounded-[2px] bg-card"></span></span>
          <span class="text-lg font-semibold">One Wallet</span>
        </a>
        <nav aria-label="Main" class="flex flex-col">${NAV.map(navLink).join('')}</nav>
        <nav aria-label="Account" class="mt-auto flex flex-col pb-4">${NAV2.map(navLink).join('')}</nav>
        <p class="border-t border-line px-[31px] py-4 text-[15px] text-ink-2">Next payday · ${shortDate(PAYDAY.slice(5))}</p>
      </aside>

      <div class="min-w-0">
        <header class="md:hidden flex items-center justify-between px-4 pt-4">
          <span class="flex items-center gap-2"><span class="w-6 h-6 rounded-[6px] bg-ink flex items-center justify-center" aria-hidden="true"><span class="w-2.5 h-2 rounded-[1px] bg-card"></span></span><span class="font-semibold">One Wallet</span></span>
          <span class="${C.meta}">Payday ${shortDate(PAYDAY.slice(5))}</span>
        </header>
        <main id="main" class="max-w-[1040px] px-4 pt-5 pb-28 md:px-[30px] md:pt-[26px] md:pb-10">${V[S.view]()}</main>
      </div>
    </div>

    <nav aria-label="Main" class="md:hidden fixed inset-x-0 bottom-0 z-30 bg-card border-t border-line grid grid-cols-5 pb-[env(safe-area-inset-bottom)]">
      ${TABS.map(([k, l, ic]) => {
        const on = S.view === k || (k === 'more' && MORE_GROUP.includes(S.view));
        return `<a href="#${k}" ${on ? 'aria-current="page"' : ''} class="flex flex-col items-center justify-center gap-0.5 h-16 text-xs ${on ? 'text-ink font-semibold' : 'text-mute'}">
          <span class="relative">${icon(ic, 'w-6 h-6')}${on ? '<span class="absolute -bottom-1 left-1/2 -translate-x-1/2 w-4 h-[3px] rounded-full bg-marigold" aria-hidden="true"></span>' : ''}</span>
          <span class="mt-1">${l}</span></a>`;
      }).join('')}
    </nav>

    ${S.modal ? `
      <div class="fixed inset-0 z-50 bg-ink/40 flex items-end sm:items-center justify-center sm:p-4" onclick="if(event.target===this)closeModal()">
        <div role="dialog" aria-modal="true" aria-labelledby="modal-title" class="dialog-in w-full sm:w-[460px] max-h-[90dvh] overflow-y-auto bg-card border border-line rounded-t-card sm:rounded-card p-5 sm:p-6 pb-[max(1.25rem,env(safe-area-inset-bottom))]">
          ${M[S.modal]()}
        </div>
      </div>` : ''}`;

  if (S.modal) {
    const firstErr = document.querySelector('[aria-invalid="true"]');
    (firstErr || document.querySelector('[data-autofocus]') || document.querySelector('[role="dialog"] button'))?.focus();
  }
}

/* Keep focus inside an open dialog; Escape closes it. */
window.addEventListener('keydown', e => {
  if (!S.modal) return;
  if (e.key === 'Escape') { closeModal(); return; }
  if (e.key === 'Enter' && e.target.matches('[role="dialog"] input')) { e.preventDefault(); document.querySelector('[role="dialog"] .flex.justify-end button:last-child')?.click(); return; }
  if (e.key !== 'Tab') return;
  const f = [...document.querySelectorAll('[role="dialog"] :is(button,input,select,textarea,a[href])')];
  if (!f.length) return;
  if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f.at(-1).focus(); }
  else if (!e.shiftKey && document.activeElement === f.at(-1)) { e.preventDefault(); f[0].focus(); }
});

/* Old hashes from the previous version keep working. */
const ALIAS = { dash: 'today', wal: 'wallets', tx: 'ledger', imp: 'import', bill: 'bills', ins: 'insights', set: 'settings' };
function route() {
  let v = location.hash.slice(1);
  if (ALIAS[v]) { location.replace('#' + ALIAS[v]); return; }
  if (!V[v]) v = 'login';
  const changed = S.view !== v;
  S.view = v; S.modal = ''; S.pr = changed ? null : S.pr;
  if (changed && !keepWallet) S.wid = 0;
  keepWallet = false;
  R();
  if (changed) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
</script>
</body>
</html>
