<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>One Wallet — Multi-Wallet Finance Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="./dist/output.css" rel="stylesheet">
  <style>
    body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .num { font-variant-numeric: tabular-nums; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-900 min-h-screen antialiased selection:bg-teal-100 selection:text-teal-900 pb-16 md:pb-0">
  <div id="app"></div>
  <script>
  const TODAY='2026-09-30',PAYDAY='2026-10-15',
  $=n=>'₱'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}),
  E=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])),
  V=id=>document.getElementById(id).value;

  // Solid, tasteful Lucide-style SVG Icons
  const IC={
    dash:'<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/></svg>',
    wal:'<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"/></svg>',
    tx:'<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>',
    imp:'<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-2m-4-1v8m0 0l3-3m-3 3L9 8m-5 5h2.586a1 1 0 01.707.293l2.414 2.414a1 1 0 00.707.293h3.172a1 1 0 00.707-.293l2.414-2.414a1 1 0 01.707-.293H20"/></svg>',
    bill:'<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>',
    ins:'<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/></svg>',
    set:'<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>',
    help:'<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>',
    plus:'<svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>',
    check:'<svg class="w-4 h-4 text-emerald-300 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/></svg>'
  };

  const CAT_STYLE={
    Food:'bg-amber-100/70 text-amber-900 border-amber-300',
    Transport:'bg-sky-100/70 text-sky-900 border-sky-300',
    Load:'bg-indigo-100/70 text-indigo-900 border-indigo-300',
    Bills:'bg-rose-100/70 text-rose-900 border-rose-300',
    Income:'bg-emerald-100/70 text-emerald-900 border-emerald-300',
    Others:'bg-slate-200/70 text-slate-800 border-slate-300'
  };

  // Cohesive, solid design system
  const K={
    card:'bg-white border border-slate-200/90 rounded-2xl p-5 shadow-xs transition-shadow hover:shadow-sm',
    hero:'bg-teal-900 text-white rounded-2xl p-5 shadow-sm border border-teal-800',
    dark:'bg-slate-900 text-white rounded-2xl p-5 shadow-sm border border-slate-800',
    btn:'inline-flex items-center justify-center gap-2 bg-teal-800 hover:bg-teal-900 active:scale-[0.98] focus:ring-2 focus:ring-teal-700 text-white rounded-xl px-4 py-2.5 font-semibold text-sm cursor-pointer shadow-xs transition-all',
    ghost:'inline-flex items-center justify-center gap-2 bg-white hover:bg-teal-50 active:scale-[0.98] focus:ring-2 focus:ring-teal-700 text-teal-900 border border-teal-800/40 rounded-xl px-4 py-2.5 font-semibold text-sm cursor-pointer transition-all',
    danger:'bg-white hover:bg-rose-50 focus:ring-2 focus:ring-rose-400 text-rose-800 border border-rose-300 rounded-lg min-w-[32px] min-h-[32px] p-1.5 flex items-center justify-center font-bold text-xs cursor-pointer transition-colors',
    row:'flex justify-between items-center py-3 text-sm gap-3 border-b border-slate-100 last:border-b-0 hover:bg-slate-50/80 px-2 rounded-lg transition-colors',
    inp:'w-full border border-slate-300 rounded-xl px-3.5 py-2.5 text-sm mt-1 mb-3 placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-teal-700 focus:border-teal-700 bg-white shadow-xs transition-all',
    lbl:'block text-xs font-bold text-slate-800 uppercase tracking-wider mt-2 mb-1',
    h:'text-2xl font-extrabold text-slate-900 tracking-tight',
    m:'text-[13px] text-slate-600 leading-relaxed',
    mt:'text-xs font-bold uppercase tracking-wider text-slate-200',
    k:'text-3xl font-extrabold tracking-tight num',
    grid:'grid grid-cols-1 md:grid-cols-2 gap-4',
    hd:'flex justify-between items-center mb-1 flex-wrap gap-3',
    btns:'flex gap-2.5 flex-wrap mt-4 justify-end',
    pill:'inline-flex items-center justify-center rounded-xl px-3.5 py-1.5 text-xs font-semibold cursor-pointer transition-all min-h-[34px] border',
    track:'h-2.5 bg-slate-100 rounded-full flex-1 overflow-hidden p-0.5 border border-slate-200',
    bar:'block h-full rounded-full bg-amber-600 transition-all duration-500',
    barg:'block h-full rounded-full bg-emerald-700 transition-all duration-500',
    neg:'font-bold text-rose-800 num',
    pos:'font-bold text-emerald-800 num',
    nav:'flex items-center gap-3 px-3.5 py-2.5 rounded-xl text-sm font-semibold cursor-pointer transition-all',
    navOn:'bg-teal-800 text-white shadow-xs font-bold',
    navOff:'text-slate-300 hover:bg-slate-800 hover:text-white',
    tabMob:'flex flex-col items-center justify-center flex-1 py-1.5 text-[11px] font-semibold transition-colors'
  };

  const pill=on=>K.pill+(on?' bg-teal-800 text-white border-teal-800 shadow-xs':' bg-white text-slate-700 border-slate-300 hover:bg-slate-100');
  const catBadge=c=>`<span class="inline-flex items-center px-2 py-0.5 rounded-md text-[11px] font-bold border ${(CAT_STYLE[c]||CAT_STYLE.Others)}">${E(c)}</span>`;

  const seed=()=>({view:'login',wid:0,fw:0,modal:'',pr:null,raw:'',n:20,
    w:[{id:1,n:'GCash',b:1200,p:'E-Wallet'},{id:2,n:'Maya',b:2100,p:'Digital Bank'},{id:3,n:'GoTyme',b:800,p:'Digital Bank'},{id:4,n:'Cash',b:150,p:'Physical'}],
    t:[{id:1,d:'09-30',s:'Jollibee',c:'Food',w:1,a:-189},{id:2,d:'09-30',s:'Salary',c:'Income',w:2,a:12000},{id:3,d:'09-29',s:'Load',c:'Load',w:1,a:-50},{id:4,d:'09-29',s:'Grab',c:'Transport',w:1,a:-140}],
    b:[{id:1,n:'Wi-Fi',a:1299,d:'Oct 5'},{id:2,n:'Spotify',a:200,d:'Oct 9'}]});

  let S=seed();
  try{const saved=JSON.parse(localStorage.getItem('onewallet'));if(saved)S={...S,...saved}}catch(e){}

  const wn=i=>{const w=S.w.find(x=>x.id==i);return w?E(w.n):'?'},
  tot=()=>S.w.reduce((s,w)=>s+w.b,0),res=()=>S.b.reduce((s,b)=>s+b.a,0),
  days=()=>Math.max(1,Math.round((new Date(PAYDAY)-new Date(TODAY))/864e5)),
  per=()=>Math.max(0,(tot()-res())/days()),
  go=v=>{if(location.hash=='#'+v){S.view=v;S.wid=0;S.pr=null;R()}else location.hash=v},
  op=m=>{S.modal=m;R()},
  wopt=s=>S.w.map(w=>`<option value="${w.id}" ${w.id==s?'selected':''}>${E(w.n)} (${$(w.b)})</option>`).join(''),
  btns=f=>`<div class="${K.btns}"><button type="button" class="${K.ghost}" onclick="op('')">Cancel</button><button type="button" class="${K.btn}" onclick="${f}">Save Entry</button></div>`;

  function add(w,a,s,c){S.t.unshift({id:++S.n,d:'09-30',s,c,w:+w,a});S.w.find(z=>z.id==w).b+=a}
  function del(id){const t=S.t.find(x=>x.id==id);S.w.find(z=>z.id==t.w).b-=t.a;S.t=S.t.filter(x=>x.id!=id);R()}
  
  function txRows(l,d){
    return l.map(t=>`
      <div class="${K.row}">
        <div class="flex items-center gap-3 min-w-0">
          <div class="w-8 h-8 rounded-full flex items-center justify-center font-bold text-xs shrink-0 ${t.a>0?'bg-emerald-100 text-emerald-900 border border-emerald-300':'bg-slate-100 text-slate-800 border border-slate-200'}">
            ${t.a>0?'↓':'↑'}
          </div>
          <div class="min-w-0">
            <div class="font-bold text-slate-900 truncate">${E(t.s)}</div>
            <div class="flex items-center gap-1.5 mt-0.5">
              ${catBadge(t.c)}
              <span class="text-xs text-slate-600 font-medium">• ${wn(t.w)}</span>
            </div>
          </div>
        </div>
        <div class="flex items-center gap-3 shrink-0">
          <span class="text-xs text-slate-600 font-medium max-sm:hidden">${t.d}</span>
          <b class="${t.a<0?K.neg:K.pos}">${t.a<0?'−':'+'}${$(t.a)}</b>
          ${d?`<button type="button" class="${K.danger}" onclick="del(${t.id})" aria-label="Delete transaction: ${E(t.s)}">✕</button>`:''}
        </div>
      </div>
    `).join('')||`<div class="py-8 text-center text-slate-500 text-sm">No transactions found.</div>`;
  }

  const SAMPLES=['GCash: You have paid ₱189.00 to Jollibee. Ref 5012 884 991.','Maya: You received ₱1,500.00 from Juan Dela Cruz.','GoTyme: You sent ₱350.00 to Grab. Ref 88231.'];
  function fill(i){S.raw=SAMPLES[i];S.pr=null;R()}
  function rd(){
    const x=S.raw=V('raw'),a=(x.match(/(?:₱|PHP\s?)\s?([\d,]+(?:\.\d+)?)/i)||[])[1];
    if(!a){S.pr={err:'No transaction amount detected. Please check the text format or try a sample alert.'};return R()}
    const inn=/received|credited|cash[- ]?in|deposit/i.test(x),out=/paid|sent|transferred|purchase|debited|cash[- ]?out/i.test(x),
    s=(x.match(/(?:to|from|at)\s+([A-Z][\w&' -]*?)(?:\.|,|\s+Ref|$)/)||[])[1]||'Unknown Merchant',
    w=S.w.find(z=>new RegExp(z.n,'i').test(x)),
    c=inn&&!out?'Income':/jollibee|mcdo|food|coffee|milk ?tea/i.test(x)?'Food':/grab|angkas|jeep|mrt|lrt/i.test(x)?'Transport':/load|globe|smart/i.test(x)?'Load':/meralco|wifi|water|converge/i.test(x)?'Bills':'Others';
    S.pr={a:parseFloat(a.replace(/,/g,'')),dir:inn&&!out?1:-1,s,c,w:w?w.id:S.w[0].id};R()
  }
  function okp(){const p=S.pr;add(V('pw'),p.a*p.dir,p.s,p.c);S.pr=null;S.raw='';go('tx')}
  function saveTx(){const a=+V('am');if(!a)return;add(V('mw'),V('ty')*a,V('nt')||'Manual',V('mc'));S.modal='';R()}
  function saveW(){S.w.push({id:++S.n,n:V('wnm')||'Wallet',b:+V('wb')||0,p:'Custom'});S.modal='';R()}
  function saveB(){S.b.push({id:++S.n,n:V('bn')||'Bill',a:+V('ba')||0,d:V('bd')||'-'});S.modal='';R()}
  function doRec(){const w=S.w.find(x=>x.id==S.wid),d=+V('rb')-w.b;if(d)add(w.id,d,'Reconciliation adjustment','Others');S.modal='';R()}

  const M={
    tx:()=>`
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h2 id="modal-title" class="text-xl font-extrabold text-slate-900">Add Transaction</h2>
        <button type="button" class="text-slate-500 hover:text-slate-800 text-lg p-1" onclick="op('')">✕</button>
      </div>
      <label class="${K.lbl}" for="ty">Transaction Type</label>
      <select id="ty" class="${K.inp}" aria-label="Transaction type"><option value="-1">Expense (Money Out)</option><option value="1">Income (Money In)</option></select>
      <label class="${K.lbl}" for="am">Amount (₱)</label>
      <input id="am" type="number" step="0.01" class="${K.inp} font-bold text-base" placeholder="0.00" aria-label="Amount in Pesos" autofocus>
      <label class="${K.lbl}" for="mw">Source Wallet</label>
      <select id="mw" class="${K.inp}" aria-label="Wallet">${wopt()}</select>
      <label class="${K.lbl}" for="mc">Category</label>
      <select id="mc" class="${K.inp}" aria-label="Category">${['Food','Transport','Load','Bills','Others','Income'].map(c=>`<option>${c}</option>`).join('')}</select>
      <label class="${K.lbl}" for="nt">Note / Merchant Name</label>
      <input id="nt" class="${K.inp}" placeholder="e.g. Starbucks, Jollibee, Grab" aria-label="Note or merchant">
      ${btns('saveTx()')}`,
    wal:()=>`
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h2 id="modal-title" class="text-xl font-extrabold text-slate-900">Add Wallet or Bank</h2>
        <button type="button" class="text-slate-500 hover:text-slate-800 text-lg p-1" onclick="op('')">✕</button>
      </div>
      <label class="${K.lbl}" for="wnm">Wallet Name</label>
      <input id="wnm" class="${K.inp}" placeholder="e.g. MariBank, Seabank, BDO" aria-label="Wallet name" autofocus>
      <label class="${K.lbl}" for="wb">Initial Balance (₱)</label>
      <input id="wb" type="number" step="0.01" class="${K.inp} font-bold" placeholder="0.00" aria-label="Starting balance">
      ${btns('saveW()')}`,
    bill:()=>`
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h2 id="modal-title" class="text-xl font-extrabold text-slate-900">Add Upcoming Bill</h2>
        <button type="button" class="text-slate-500 hover:text-slate-800 text-lg p-1" onclick="op('')">✕</button>
      </div>
      <label class="${K.lbl}" for="bn">Bill Description</label>
      <input id="bn" class="${K.inp}" placeholder="e.g. Converge Fiber, Netflix, Meralco" aria-label="Bill name" autofocus>
      <label class="${K.lbl}" for="ba">Amount Reserved (₱)</label>
      <input id="ba" type="number" step="0.01" class="${K.inp} font-bold" placeholder="0.00" aria-label="Bill amount">
      <label class="${K.lbl}" for="bd">Due Date / Cycle</label>
      <input id="bd" class="${K.inp}" placeholder="e.g. Oct 15, Every 20th" aria-label="Due date">
      ${btns('saveB()')}`,
    rec:()=>{const w=S.w.find(x=>x.id==S.wid);return `
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h2 id="modal-title" class="text-xl font-extrabold text-slate-900">Reconcile ${E(w.n)}</h2>
        <button type="button" class="text-slate-500 hover:text-slate-800 text-lg p-1" onclick="op('')">✕</button>
      </div>
      <div class="bg-amber-100/70 border border-amber-300 rounded-xl p-3 my-3 text-xs text-amber-950 leading-relaxed">
        One Wallet currently tracks <b>${$(w.b)}</b>. Enter what your real banking app shows to record an automatic balance adjustment.
      </div>
      <label class="${K.lbl}" for="rb">Actual Real Balance (₱)</label>
      <input id="rb" type="number" step="0.01" class="${K.inp} font-bold text-base" placeholder="0.00" aria-label="Real balance" autofocus>
      ${btns('doRec()')}`}};

  const VW={
    login:()=>`
      <div class="min-h-screen flex">
        <div class="flex-1 flex flex-col justify-between p-12 bg-slate-950 text-white max-md:hidden relative border-r border-slate-800">
          <div class="flex items-center gap-2 text-xl font-extrabold tracking-tight">
            <span class="w-8 h-8 rounded-lg bg-teal-800 border border-teal-700 flex items-center justify-center text-teal-200">◎</span>
            One Wallet
          </div>
          <div class="max-w-md">
            <h1 class="text-4xl font-extrabold tracking-tight leading-tight">All your Philippine wallets.<br><span class="text-teal-400">One intelligent view.</span></h1>
            <p class="text-slate-300 text-sm mt-3 leading-relaxed">Consolidate GCash, Maya, GoTyme, and cash balances into an automated daily spend runway.</p>
          </div>
          <div class="text-xs text-slate-400 font-medium">© 2026 One Wallet • Philippine Digital Banking Suite</div>
        </div>
        <div class="flex-1 flex flex-col justify-center px-[10%] bg-white">
          <div class="max-w-sm w-full mx-auto">
            <h2 class="${K.h} mb-1">Sign in to your wallet</h2>
            <p class="text-sm text-slate-600 mb-6 font-medium">Enter demo credentials to explore your dashboard.</p>
            <label class="${K.lbl}" for="login-email">Email Address</label>
            <input id="login-email" class="${K.inp}" value="user@onewallet.ph" placeholder="user@onewallet.ph" aria-label="Email address" autocomplete="username">
            <label class="${K.lbl}" for="login-pwd">Password</label>
            <input id="login-pwd" type="password" class="${K.inp}" value="password123" placeholder="••••••••" aria-label="Password" autocomplete="current-password">
            <button type="button" class="${K.btn} w-full mt-2" onclick="go('dash')">Sign In to One Wallet</button>
            <div class="text-center text-xs text-slate-500 font-medium mt-4">Local prototype: click Sign In to continue.</div>
          </div>
        </div>
      </div>`,

    dash:()=>`
      <div class="${K.hd}">
        <div>
          <h1 class="${K.h}">Financial Dashboard</h1>
          <p class="${K.m}">Real-time cashflow runway until Payday (Oct 15, 2026)</p>
        </div>
        <button type="button" class="${K.btn}" onclick="op('tx')">${IC.plus} Add Transaction</button>
      </div>

      <div class="${K.grid}">
        <div class="${K.hero}">
          <div class="${K.mt}">Consolidated Net Worth</div>
          <div class="${K.k} text-4xl my-1 text-white">${$(tot())}</div>
          <div class="text-xs text-teal-100 font-semibold flex items-center gap-1.5 mt-2">
            ${IC.check} Across ${S.w.length} connected accounts
          </div>
        </div>

        <div class="${K.dark}">
          <div class="flex items-center justify-between">
            <div class="${K.mt}">Spendable Daily Runway</div>
            <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-slate-800 text-teal-300 border border-slate-700">${days()} Days Left</span>
          </div>
          <div class="${K.k} text-4xl text-teal-300 my-1">${$(per())} <span class="text-sm font-normal text-slate-300">/day</span></div>
          <div class="text-xs text-slate-300 font-medium flex items-center gap-2 mt-2">
            <span>Reserved for bills: <b class="text-white num">${$(res())}</b></span>
          </div>
        </div>
      </div>

      <div class="${K.grid}">
        <div class="${K.card}">
          <div class="flex items-center justify-between mb-3">
            <h2 class="font-extrabold text-slate-900 text-base">Recent Transactions</h2>
            <a href="#tx" class="text-xs font-bold text-teal-800 hover:underline">View all →</a>
          </div>
          ${txRows(S.t.slice(0,5))}
        </div>

        <div class="${K.card}">
          <div class="flex items-center justify-between mb-3">
            <h2 class="font-extrabold text-slate-900 text-base">Active Accounts</h2>
            <button type="button" class="text-xs font-bold text-teal-800 hover:underline" onclick="op('wal')">+ New</button>
          </div>
          <div class="space-y-1">
            ${S.w.map(w=>`
              <div class="${K.row} cursor-pointer hover:bg-slate-100/70 rounded-xl px-3 transition-colors" onclick="S.wid=${w.id};go('wal')">
                <div>
                  <div class="font-bold text-slate-900">${E(w.n)}</div>
                  <div class="text-xs text-slate-600 font-medium">${w.p||'E-Wallet'}</div>
                </div>
                <div class="text-right">
                  <div class="font-extrabold text-slate-900 num">${$(w.b)}</div>
                  <span class="text-[11px] text-teal-800 font-bold">Manage →</span>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>`,

    wal:()=>{
      const w=S.w.find(x=>x.id==S.wid);
      return w?`
        <div class="mb-2">
          <button type="button" class="inline-flex items-center gap-1 text-xs font-bold text-teal-800 hover:text-teal-950 cursor-pointer py-1" onclick="S.wid=0;R()">
            ← Back to all wallets
          </button>
        </div>
        <div class="${K.hd}">
          <div>
            <h1 class="${K.h}">${E(w.n)}</h1>
            <p class="${K.m}">Managed account • ${w.p||'Digital Wallet'}</p>
          </div>
          <button type="button" class="${K.btn}" onclick="op('rec')">Reconcile Real Balance</button>
        </div>
        <div class="${K.hero}">
          <div class="${K.mt}">Current Ledger Balance</div>
          <div class="${K.k} text-4xl my-1 text-white">${$(w.b)}</div>
          <div class="text-xs text-teal-100 font-medium mt-2">To align with your bank statement, use Reconcile Balance.</div>
        </div>
        <div class="${K.card}">
          <h2 class="font-extrabold text-slate-900 text-base mb-3">${E(w.n)} Transaction History</h2>
          ${txRows(S.t.filter(t=>t.w==w.id))}
        </div>
      `:`
        <div class="${K.hd}">
          <div>
            <h1 class="${K.h}">Wallets & Bank Accounts</h1>
            <p class="${K.m}">Manage balances across your physical and digital accounts</p>
          </div>
          <button type="button" class="${K.btn}" onclick="op('wal')">${IC.plus} Add Wallet</button>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
          ${S.w.map(w=>`
            <div class="${K.card} cursor-pointer hover:border-teal-700 focus:ring-2 focus:ring-teal-700 focus:outline-none transition-all group" tabindex="0" role="button" aria-label="Open wallet ${E(w.n)}" onclick="S.wid=${w.id};R()" onkeydown="if(event.key==='Enter'||event.key===' '){S.wid=${w.id};R()}">
              <div class="flex items-center justify-between text-xs text-slate-600 mb-2">
                <span class="font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-800 border border-slate-200">${w.p||'Account'}</span>
                <span class="text-teal-800 group-hover:translate-x-0.5 transition-transform font-bold">→</span>
              </div>
              <b class="text-lg text-slate-900 block truncate font-extrabold">${E(w.n)}</b>
              <div class="${K.k} text-2xl text-teal-900 mt-2">${$(w.b)}</div>
            </div>
          `).join('')}
        </div>
      `;
    },

    tx:()=>`
      <div class="${K.hd}">
        <div>
          <h1 class="${K.h}">Transactions Ledger</h1>
          <p class="${K.m}">Itemized record of expenses, incomes, and balance adjustments</p>
        </div>
        <button type="button" class="${K.btn}" onclick="op('tx')">${IC.plus} Add Entry</button>
      </div>
      <div class="flex flex-wrap items-center gap-1.5 py-1">
        <span class="${pill(S.fw==0)}" tabindex="0" role="button" onclick="S.fw=0;R()" onkeydown="if(event.key==='Enter'||event.key===' '){S.fw=0;R()}">All Accounts</span>
        ${S.w.map(w=>`<span class="${pill(S.fw==w.id)}" tabindex="0" role="button" onclick="S.fw=${w.id};R()" onkeydown="if(event.key==='Enter'||event.key===' '){S.fw=${w.id};R()}">${E(w.n)}</span>`).join('')}
      </div>
      <div class="${K.card}">
        ${txRows(S.t.filter(t=>!S.fw||t.w==S.fw),1)}
      </div>`,

    imp:()=>{
      const p=S.pr;
      return `
        <div class="${K.hd}">
          <div>
            <h1 class="${K.h}">Smart Alert Import</h1>
            <p class="${K.m}">Paste transaction SMS or push notification text from GCash, Maya, or GoTyme</p>
          </div>
        </div>

        <div class="${K.card}">
          <label class="${K.lbl}" for="raw">Paste Alert Notification</label>
          <textarea id="raw" rows="3" class="${K.inp} font-mono text-xs leading-relaxed" placeholder="e.g. GCash: You have paid ₱189.00 to Jollibee..." aria-label="Paste alert text">${E(S.raw)}</textarea>
          
          <div class="flex items-center justify-between flex-wrap gap-2 mt-2">
            <button type="button" class="${K.btn}" onclick="rd()">Parse Alert Text</button>
            <div class="flex items-center gap-1.5 flex-wrap">
              <span class="text-xs text-slate-600 font-bold">Try Sample:</span>
              <button type="button" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 cursor-pointer" onclick="fill(0)">GCash</button>
              <button type="button" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 cursor-pointer" onclick="fill(1)">Maya</button>
              <button type="button" class="px-2.5 py-1 text-xs font-bold rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-800 border border-slate-300 cursor-pointer" onclick="fill(2)">GoTyme</button>
            </div>
          </div>
        </div>

        ${p?(p.err?`
          <div class="bg-rose-100/70 border border-rose-300 rounded-2xl p-4 text-sm font-bold text-rose-900">
            ⚠️ ${p.err}
          </div>
        `:`
          <div class="${K.card} border-teal-800/30 bg-teal-50/20">
            <div class="flex items-center justify-between pb-3 border-b border-slate-200 mb-3">
              <h2 class="font-extrabold text-slate-900 text-base">Detected Payment Details</h2>
              <span class="text-xs font-bold px-2 py-0.5 rounded-full bg-emerald-100 text-emerald-900 border border-emerald-300">Ready to Add</span>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm mb-4">
              <div class="p-3 bg-white border border-slate-200 rounded-xl">
                <span class="text-xs text-slate-600 font-semibold block">Amount</span>
                <b class="text-lg num text-slate-900 font-extrabold">${$(p.a)}</b>
              </div>
              <div class="p-3 bg-white border border-slate-200 rounded-xl">
                <span class="text-xs text-slate-600 font-semibold block">Direction</span>
                <b class="text-base font-bold ${p.dir>0?'text-emerald-800':'text-slate-900'}">${p.dir>0?'Income (In)':'Expense (Out)'}</b>
              </div>
              <div class="p-3 bg-white border border-slate-200 rounded-xl">
                <span class="text-xs text-slate-600 font-semibold block">Merchant</span>
                <b class="text-base text-slate-900 truncate block font-bold">${E(p.s)}</b>
              </div>
              <div class="p-3 bg-white border border-slate-200 rounded-xl">
                <span class="text-xs text-slate-600 font-semibold block">Category</span>
                <b class="text-base text-slate-900 font-bold">${catBadge(p.c)}</b>
              </div>
            </div>

            <label class="${K.lbl}" for="pw">Assign Transaction to Account</label>
            <select id="pw" class="${K.inp}" aria-label="Select wallet">${wopt(p.w)}</select>
            <button type="button" class="${K.btn} w-full mt-2" onclick="okp()">Confirm and Save to Ledger</button>
          </div>
        `):''}
      `;
    },

    bill:()=>`
      <div class="${K.hd}">
        <div>
          <h1 class="${K.h}">Upcoming Bills & Obligations</h1>
          <p class="${K.m}">Amounts quarantined from your spendable daily runway</p>
        </div>
        <button type="button" class="${K.btn}" onclick="op('bill')">${IC.plus} Add Bill</button>
      </div>

      <div class="${K.hero}">
        <div class="${K.mt}">Total Quarantined for Bills</div>
        <div class="${K.k} text-4xl my-1 text-white">${$(res())}</div>
        <div class="text-xs text-teal-100 font-medium mt-2">Deducted automatically before calculating your daily spend runway.</div>
      </div>

      <div class="${K.card}">
        <h2 class="font-extrabold text-slate-900 text-base mb-3">Recurring Obligations</h2>
        <div class="space-y-1">
          ${S.b.map(b=>`
            <div class="${K.row}">
              <div>
                <b class="text-slate-900 font-bold">${E(b.n)}</b>
                <div class="text-xs text-slate-600 font-medium">Due date: ${E(b.d)}</div>
              </div>
              <div class="flex items-center gap-3">
                <b class="text-slate-900 num font-extrabold">${$(b.a)}</b>
                <button type="button" class="${K.danger}" onclick="S.b=S.b.filter(x=>x.id!=${b.id});R()" aria-label="Delete bill: ${E(b.n)}">✕</button>
              </div>
            </div>
          `).join('')||`<div class="py-6 text-center text-slate-500 text-sm">No bills added yet.</div>`}
        </div>
      </div>`,

    ins:()=>{
      const m={};
      S.t.filter(t=>t.a<0).forEach(t=>m[t.c]=(m[t.c]||0)-t.a);
      const inc=S.t.filter(t=>t.a>0).reduce((s,t)=>s+t.a,0),
      out=Object.values(m).reduce((s,v)=>s+v,0),
      mx=Math.max(1,...Object.values(m));

      return `
        <div class="${K.hd}">
          <div>
            <h1 class="${K.h}">Spending Analytics</h1>
            <p class="${K.m}">Breakdown of cash outflows and inflow ratios</p>
          </div>
        </div>

        <div class="${K.grid}">
          <div class="${K.card}">
            <h2 class="font-extrabold text-slate-900 text-base mb-4">Cash In vs Cash Out</h2>
            <div class="space-y-4">
              <div>
                <div class="flex justify-between text-xs font-bold mb-1">
                  <span class="text-emerald-800">Total Income</span>
                  <span class="num text-slate-900 font-extrabold">${$(inc)}</span>
                </div>
                <div class="${K.track}"><i class="${K.barg}" style="width:100%"></i></div>
              </div>
              <div>
                <div class="flex justify-between text-xs font-bold mb-1">
                  <span class="text-amber-800">Total Expenses</span>
                  <span class="num text-slate-900 font-extrabold">${$(out)} (${inc?Math.round(out/inc*100):0}%)</span>
                </div>
                <div class="${K.track}"><i class="${K.bar}" style="width:${inc?Math.min(100,out/inc*100):0}%"></i></div>
              </div>
            </div>
          </div>

          <div class="${K.card}">
            <h2 class="font-extrabold text-slate-900 text-base mb-3">Top Expense Categories</h2>
            <div class="space-y-3">
              ${Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`
                <div>
                  <div class="flex justify-between items-center text-xs mb-1">
                    <span class="font-bold">${catBadge(k)}</span>
                    <b class="text-slate-900 num font-extrabold">${$(v)}</b>
                  </div>
                  <div class="${K.track}"><i class="${K.bar}" style="width:${v/mx*100}%"></i></div>
                </div>
              `).join('')||`<div class="py-6 text-center text-slate-500 text-sm">No recorded expenses yet.</div>`}
            </div>
          </div>
        </div>`;
    },

    set:()=>`
      <div class="${K.hd}">
        <div>
          <h1 class="${K.h}">Application Settings</h1>
          <p class="${K.m}">Manage session and local state</p>
        </div>
      </div>
      <div class="${K.card}">
        <div class="${K.row}">
          <div>
            <div class="font-bold text-slate-900">Sign Out</div>
            <div class="text-xs text-slate-600 font-medium">Return to the welcome sign in page</div>
          </div>
          <button type="button" class="${K.ghost}" onclick="go('login')">Sign out</button>
        </div>
        <div class="${K.row}">
          <div>
            <div class="font-bold text-rose-800">Reset Demo Data</div>
            <div class="text-xs text-slate-600 font-medium">Restore factory sample wallets, transactions, and bills</div>
          </div>
          <button type="button" class="${K.danger} !px-4" onclick="S=seed();go('dash')">Reset All Data</button>
        </div>
      </div>`,

    help:()=>`
      <div class="${K.hd}">
        <div>
          <h1 class="${K.h}">Documentation & Guide</h1>
          <p class="${K.m}">How One Wallet tracks your finances without server sync</p>
        </div>
      </div>
      <div class="${K.grid}">
        <div class="${K.card}">
          <h2 class="font-extrabold text-slate-900 text-base mb-3">How it works</h2>
          <div class="space-y-3 text-sm text-slate-800">
            <div class="flex gap-2.5">
              <span class="w-6 h-6 rounded-full bg-teal-800 text-white font-bold flex items-center justify-center text-xs shrink-0">1</span>
              <div><b>Record your accounts</b>: Add GCash, Maya, GoTyme, or Cash balances.</div>
            </div>
            <div class="flex gap-2.5">
              <span class="w-6 h-6 rounded-full bg-teal-800 text-white font-bold flex items-center justify-center text-xs shrink-0">2</span>
              <div><b>Copy payment alerts</b>: When you pay, copy the SMS/app notification and paste it in Smart Alert Import.</div>
            </div>
            <div class="flex gap-2.5">
              <span class="w-6 h-6 rounded-full bg-teal-800 text-white font-bold flex items-center justify-center text-xs shrink-0">3</span>
              <div><b>Check your runway</b>: Know exactly how much money you can spend per day until next payday.</div>
            </div>
          </div>
        </div>

        <div class="${K.card}">
          <h2 class="font-extrabold text-slate-900 text-base mb-3">Frequently Asked Questions</h2>
          <div class="space-y-2.5 text-xs text-slate-700 leading-relaxed">
            <div><b class="text-slate-900">Does it connect to banks directly?</b><br>No. There are no bank API credentials required; it reads text from notifications you paste.</div>
            <div><b class="text-slate-900">Is my transaction data stored online?</b><br>No. Everything stays in your browser's private local storage.</div>
            <div><b class="text-slate-900">My real wallet balance is slightly off.</b><br>Open that wallet and click "Reconcile Balance" to make an audit-friendly correction.</div>
          </div>
        </div>
      </div>`
  };

  function R(){
    try{localStorage.setItem('onewallet',JSON.stringify({w:S.w,t:S.t,b:S.b,n:S.n}))}catch(e){}
    const a=document.getElementById('app');
    if(S.view=='login'){a.innerHTML=VW.login();return}
    
    const nav=[
      ['dash','Dashboard',IC.dash],
      ['wal','Wallets',IC.wal],
      ['tx','Transactions',IC.tx],
      ['imp','Import',IC.imp],
      ['bill','Bills',IC.bill],
      ['ins','Insights',IC.ins],
      ['set','Settings',IC.set],
      ['help','Help',IC.help]
    ];

    a.innerHTML=`
      <div class="flex min-h-screen">
        <!-- Desktop Sidebar -->
        <nav aria-label="Main Navigation" class="w-60 shrink-0 bg-slate-950 px-4 py-6 flex flex-col justify-between text-white max-md:hidden border-r border-slate-800">
          <div class="space-y-6">
            <div class="flex items-center gap-2.5 px-2">
              <span class="w-7 h-7 rounded-lg bg-teal-800 border border-teal-700 flex items-center justify-center text-teal-200 font-extrabold text-sm">◎</span>
              <span class="font-extrabold tracking-tight text-base text-white">One Wallet</span>
            </div>
            <div class="space-y-1">
              ${nav.map(([k,l,ic])=>`
                <a href="#${k}" class="${K.nav} ${S.view==k?K.navOn:K.navOff}" onclick="go('${k}')">
                  ${ic}
                  <span>${l}</span>
                </a>
              `).join('')}
            </div>
          </div>
          <div class="px-2 pt-4 border-t border-slate-800 text-[11px] text-slate-400 font-medium flex items-center justify-between">
            <span>Payday: Oct 15</span>
            <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
          </div>
        </nav>

        <!-- Main Content Surface -->
        <main class="flex-1 max-w-[1100px] p-6 md:p-8 flex flex-col gap-5 overflow-y-auto">
          ${VW[S.view]()}
        </main>
      </div>

      <!-- Mobile Bottom Navigation Bar -->
      <nav aria-label="Mobile Navigation" class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 z-40 flex items-center justify-around px-2 py-1 shadow-lg">
        ${nav.slice(0,5).map(([k,l,ic])=>`
          <a href="#${k}" class="${K.tabMob} ${S.view==k?'text-teal-900 font-extrabold':'text-slate-600'}" onclick="go('${k}')">
            ${ic}
            <span class="text-[10px] mt-0.5">${l}</span>
          </a>
        `).join('')}
      </nav>

      <!-- Accessible Modal Overlay -->
      ${S.modal?`
        <div class="fixed inset-0 bg-slate-950/60 backdrop-blur-xs flex items-center justify-center z-50 p-4" role="dialog" aria-modal="true" aria-labelledby="modal-title" onclick="if(event.target===this)op('')">
          <div class="bg-white rounded-2xl p-6 sm:p-7 w-[460px] max-w-full shadow-2xl border border-slate-100 transition-all scale-100">
            ${M[S.modal]()}
          </div>
        </div>
      `:''}
    `;
  }

  window.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.modal)op('')});
  window.addEventListener('hashchange',()=>{
    const v=location.hash.slice(1);
    if(VW[v]){S.view=v;S.wid=0;S.pr=null;S.modal='';R()}
  });
  S.view=VW[location.hash.slice(1)]?location.hash.slice(1):'login';
  R();
  </script>
</body>
</html>
